<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPM1 Anatomy</title>
<meta name="description" content="An interactive anatomy of the MinimaK SPM1 simple magnetised torus: turn it like a turntable, take it apart, inspect each component on its own and read where every number comes from.">
<style>
  :root {
    --paper: #f2f0e9;
    --card: #fbfaf6;
    --ink: #1c1c1a;
    --muted: #5e5d57;
    --rule: #dad7cd;
    --soft: #efede5;
    --chip: #e8e5da;
    --accent: #0a736e;
    --spec: #2b8a6e;
    --photo: #9a6a0f;
    --assumed: #7c7a74;
    color-scheme: light;
  }
  /* The dark theme is a hologram. The class is set before first paint (script below) and by applyTheme. */
  :root.holo {
    --paper: #03080f;
    --card: #06121e;
    --ink: #cfe3f2;
    --muted: #7a9fb9;
    --rule: #16314a;
    --soft: #0a1b2a;
    --chip: #0e2436;
    --accent: #6fb8e8;
    --spec: #3cf0b4;
    --photo: #ffb54d;
    --assumed: #6a8ea8;
    --glow: rgb(90 170 225 / 0.35);
    color-scheme: dark;
    scrollbar-color: #1b3a55 transparent;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono, kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  /* Read by screen readers, never seen: the one status line. Pinned to the top-left corner of its containing block, so
     wherever it sits (even last in the body) it adds no scrollable overflow. */
  .sr-only { position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: 0; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

  /* ---------- App shell: tree | viewer | inspector, each scrolls on its own ---------- */
  .app {
    --tw: 260px; --iw: 360px;
    display: grid; height: 100vh; height: 100dvh; row-gap: 10px; padding: 10px;
    grid-template-columns: var(--tw) 10px minmax(0, 1fr) 10px var(--iw);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top top top top top" "tree gl view gr insp";
  }
  .top { grid-area: top; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand { flex: none; line-height: 1.2; }
  .brand b { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .brand span { display: block; color: var(--muted); font-size: 12px; }
  /* The tools wrap to a second row rather than scroll out of sight. */
  .modebar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; align-items: center; margin-left: auto; padding: 2px; }
  .mb { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; background: var(--card); overflow: hidden; flex: none; }
  .mb button { border: 0; background: transparent; padding: 6px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 1; white-space: nowrap; }
  .mb button + button { border-left: 1px solid var(--rule); }
  .mb button:hover { background: var(--soft); }
  .mb button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .mb svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  button:focus-visible, input:focus-visible, .stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .panel { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  /* Either side panel folds to a thin rail, to give the model and its screens the room. */
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .fold { flex: none; width: 26px; height: 24px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 17px; line-height: 1; }
  .fold:hover { background: var(--chip); color: var(--ink); }
  .rail { display: none; }
  /* The grip between a panel and the view sizes the panel; a line shows while it is hovered or dragged. */
  .grip { position: relative; cursor: col-resize; touch-action: none; outline: none; }
  .grip.left { grid-area: gl; }
  .grip.right { grid-area: gr; }
  .grip::after { content: ""; position: absolute; top: 8px; bottom: 8px; left: 4px; width: 2px; border-radius: 1px; background: var(--accent); opacity: 0; transition: opacity .15s; }
  .grip:hover::after, .grip.on::after, .grip:focus-visible::after { opacity: 0.7; }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing .stage { pointer-events: none; }
  .app.fold-tree { --tw: 34px; }
  .app.fold-insp { --iw: 34px; }
  .panel.folded > :not(.rail) { display: none; }
  .panel.folded .rail { display: block; flex: 1; border: 0; background: none; cursor: pointer; writing-mode: vertical-rl; font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 12px 0; }
  .panel.folded .rail:hover { color: var(--ink); background: var(--soft); }
  .panel-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--rule); }
  .panel-body { overflow-y: auto; overscroll-behavior: contain; padding: 8px 12px 14px; flex: 1; min-height: 0; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

  /* The first Tab stop: hidden until focused, it jumps to the assembly list. */
  .skip { position: absolute; left: 10px; top: -60px; z-index: 10; background: var(--ink); color: var(--card); padding: 6px 12px; border-radius: 8px; font-size: 13px; text-decoration: none; }
  .skip:focus { top: 10px; }

  /* ---------- Assembly tree ---------- */
  /* One Tab stop (the ARIA tree pattern): the groups and part rows are tree items that take focus in turn. */
  .tree { grid-area: tree; }
  .search { width: 100%; margin-top: 8px; font: inherit; font-size: 13px; color: var(--ink); background: var(--soft); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 9px; }
  .tree-root { list-style: none; margin: 0; padding: 0; }
  .tg { margin-top: 6px; }
  .tg-head { display: flex; align-items: center; gap: 2px; border-radius: 7px; }
  .tree-root .tg-head { cursor: pointer; }
  .tg-head .caret { flex: 1; display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 2px; cursor: pointer; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .tg-head .caret::before { content: ""; width: 0; height: 0; border-left: 4px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; transform: rotate(90deg); }
  .tg.closed .tg-head .caret::before { transform: rotate(0); }
  .tg.closed ul { display: none; }
  .tg ul { list-style: none; margin: 0; padding: 0; }
  .tg:focus { outline: none; }
  .tg:focus-visible > .tg-head, .ti:focus-visible, .ti-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ti { display: flex; align-items: center; gap: 2px; border-radius: 7px; cursor: pointer; }
  .ti:hover, .ti.hot { background: var(--soft); }
  .ti.sel { background: var(--chip); }
  .ti .name { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 7px; padding: 5px 4px; text-align: left; font-size: 13px; }
  .ti .name span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti .n { font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); min-width: 1.6em; }
  .ti .cnt { font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
  .ti-hit { padding: 3px 4px 3px 52px; border-radius: 7px; font-size: 12px; cursor: pointer; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti-hit:hover { background: var(--soft); }
  .ti-hit.more { padding: 2px 4px 4px 52px; font-size: 11.5px; color: var(--muted); cursor: default; }
  .ti-hit.more:hover { background: none; }
  .eye { flex: none; width: 26px; height: 24px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
  .eye:hover { color: var(--ink); background: var(--chip); }
  .eye svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  .eye[aria-pressed="false"] { opacity: 0.45; }
  .ti.off .name { opacity: 0.45; }
  .basis { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; border: 1.5px solid; }
  .basis.spec { background: var(--spec); border-color: var(--spec); }
  .basis.photo { background: linear-gradient(90deg, var(--photo) 50%, transparent 50%); border-color: var(--photo); }
  .basis.assumed { border-color: var(--assumed); }
  .legend-basis { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); padding: 10px 2px 2px; border-top: 1px solid var(--rule); margin-top: 12px; }
  .legend-basis div { display: flex; align-items: center; }
  .nd { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; padding: 0; list-style: none; }
  .nd li { padding: 3px 4px; display: flex; gap: 8px; justify-content: space-between; }
  .nd li span:last-child { font-size: 11.5px; white-space: nowrap; }

  /* ---------- Viewer card ---------- */
  .view { grid-area: view; position: relative; margin: 0; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; min-height: 0; }
  .stage { position: absolute; inset: 0; cursor: grab; touch-action: none; outline: none; }
  .stage.pan { cursor: move; }
  .stage.dragging { cursor: grabbing; }
  .stage.pointing { cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .corner { position: absolute; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); pointer-events: none; }
  .corner.tl { top: 12px; left: 14px; color: var(--ink); }
  .corner.tl span { color: var(--muted); }
  .corner.bl { bottom: 10px; left: 12px; max-width: 60%; }
  .corner.br { bottom: 10px; right: 12px; text-align: right; color: var(--ink); max-width: 38%; }
  .corner.bl .hint, .corner.br { background: color-mix(in srgb, var(--card) 84%, transparent); padding: 3px 6px; border-radius: 6px; }
  .scale { display: flex; align-items: flex-end; gap: 6px; margin: 0 0 6px 6px; color: var(--ink); }
  .scale i { display: block; height: 7px; border: 1.5px solid var(--ink); border-top: 0; }
  .triad { position: absolute; top: 8px; right: 8px; width: 84px; height: 84px; }
  .triad text { font: 600 10px ui-monospace, Menlo, Consolas, monospace; fill: var(--ink); cursor: pointer; }
  .triad .ax { cursor: pointer; }
  .triad .ax:hover circle { stroke-width: 2.4; }
  .triad .ring { fill: color-mix(in srgb, var(--card) 70%, transparent); stroke: var(--rule); }
  .tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--card); font-size: 12px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; transform: translate(12px, 14px); opacity: 0; transition: opacity .12s; }
  .tip.on { opacity: 0.94; }
  .tip small { opacity: 0.7; margin-left: 6px; }
  /* Information screens. While inspecting, the sheet column on the right of the view holds, in order, the part card
     (when the Part tab is not beside the view), the kept sheets and the preview. Its room is kept even while it is
     empty, so nothing in it moves the camera. It scrolls; nothing in it folds or closes by itself. A view under 660 px
     has a dock under the model instead, one card at a time. A sheet dragged out floats where it is dropped. */
  .hud { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .hud[hidden] { display: none; }
  .sheets { position: absolute; top: 80px; right: 12px; bottom: 8px; width: 280px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .sheets-head {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px 4px 4px 10px; border-radius: 10px; pointer-events: auto;
    background: color-mix(in srgb, var(--card) 90%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
  }
  .sheets-head[hidden], .sheets-head [hidden] { display: none; }
  .sheets-head .eyebrow { margin-right: auto; }
  .sheets-head .eyebrow b { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); margin-left: 3px; }
  .sheets-head button { border: 1px solid var(--rule); background: var(--soft); border-radius: 7px; padding: 3px 8px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .sheets-head button:disabled { opacity: 0.45; cursor: default; }
  .dockstep { display: inline-flex; align-items: center; gap: 2px; }
  .dockstep span { min-width: 6.5em; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
  .sheets-body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  /* The kept list scrolls. A 1 px inset keeps a lit sheet's ring inside the scroll box. */
  .sheets-list { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; display: flex; flex-direction: column; gap: 8px; padding: 1px; margin: -1px; pointer-events: auto; }
  .sheets-list:empty { display: none; }
  .screen {
    position: relative; flex: none; pointer-events: auto; overflow: hidden;
    padding: 8px 12px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.45;
    background: color-mix(in srgb, var(--card) 90%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
  }
  /* The preview sits under the kept list and takes at most half the column; a longer sheet scrolls inside it. */
  .sheets-body > .screen { max-height: calc(50% - 8px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .screen.float { position: absolute; width: 280px; max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; box-shadow: 0 8px 26px rgb(0 0 0 / 0.14); }
  .screen.enter { animation: screen-in .32s ease-out backwards; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(8px); clip-path: inset(0 0 85% 0); } to { opacity: 1; transform: none; clip-path: inset(0); } }
  .screen.live { border-style: dashed; }
  .screen.hot { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .screen.dragging { opacity: 0.9; }
  /* A folded sheet keeps only its top bar; its chevron opens it again. */
  .screen.folded { padding-bottom: 6px; }
  .screen.folded > :not(.bar) { display: none; }
  .screen.folded .bar { margin-bottom: 0; }
  /* A bar names the sub-part in full, wrapping rather than cut off, so a folded sheet still says what it holds. Under
     it, a second line: the Preview label, on how many pieces the sheet is the same, or for the part card, the piece
     in view. */
  .screen .bar { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 6px; margin: 0 -6px 4px 0; font: 600 12px/18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--muted); user-select: none; }
  .screen .bar.grab { cursor: grab; touch-action: none; }
  .screen.dragging .bar { cursor: grabbing; }
  .screen .bar .ttl { flex: 1 1 0; min-width: 0; font-weight: 600; color: var(--ink); white-space: normal; overflow-wrap: anywhere; }
  .screen .bar .line2 { order: 1; flex: 1 0 100%; min-width: 0; font-weight: 400; line-height: 16px; color: var(--muted); white-space: normal; overflow-wrap: anywhere; }
  .screen .bar .fold-btn ~ .line2 { padding-left: 30px; }
  .screen .bar .state { margin-right: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  .screen .bar button { flex: none; width: 24px; height: 22px; margin: -2px 0; border: 0; background: none; border-radius: 5px; cursor: pointer; color: var(--muted); display: grid; place-items: center; font-size: 16px; line-height: 1; }
  .screen .bar button:hover { background: var(--chip); color: var(--ink); }
  .screen .bar button svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .screen .bar .fold-btn svg { transition: transform .15s; transform: rotate(90deg); }
  .screen.folded .bar .fold-btn svg { transform: none; }
  .screen .bar button.keep { width: auto; padding: 0 8px; border: 1px solid var(--rule); background: var(--soft); color: var(--ink); font-size: 12px; font-weight: 600; }
  .screen h4 { margin: 0 0 2px; font-size: 15px; font-weight: 650; line-height: 1.25; }
  .screen h4:focus-visible, .screen .bar .ttl:focus-visible, .doc h2:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .screen h5 { margin: 10px 0 4px; font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .screen .from { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .screen p { margin: 6px 0 0; }
  .screen .mat { margin: 0 0 6px; }
  .screen .mat b { font-weight: 600; }
  .screen .note { color: var(--muted); }
  .screen table.specs { font-size: 12.5px; }
  .screen table.specs td { padding: 4px 0; }
  .screen table.specs td:first-child { width: 42%; }
  .screen .srcs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .screen .subs button { font-size: 12.5px; padding: 3px 6px; }
  /* In a view under 660 px the column becomes a dock under the model: at most 42 % of the view, one card at a time. */
  .sheets.dock { top: auto; left: 8px; width: auto; max-height: 42%; }
  .sheets.dock .sheets-body { flex: 0 1 auto; }
  .sheets.dock .fold-btn { display: none; }
  .sheets.dock .screen .bar.grab { cursor: default; touch-action: auto; }
  .sheets.dock .screen .bar .line2 { padding-left: 0; }
  .view.docked .corner.bl, .view.docked .corner.br { display: none; }
  @media (prefers-reduced-motion: reduce) { .screen.enter { animation: none; } }
  .isobar { position: absolute; top: 36px; left: 0; right: 0; width: fit-content; margin-inline: auto; display: none; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 4px 4px 4px 12px; box-shadow: 0 4px 18px rgb(0 0 0 / 0.08); max-width: calc(100% - 200px); flex-wrap: wrap; justify-content: center; row-gap: 4px; z-index: 2; }
  .isobar.on { display: flex; }
  .isobar > :not(.lbl) { flex: none; }
  .isobar .lbl { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 6px; }
  .isobar .lbl b { font-weight: 600; }
  .isobar button { border: 1px solid var(--rule); background: var(--soft); border-radius: 7px; padding: 4px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .isobar button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .isobar button.done { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .isobar #bBack { max-width: 13em; overflow: hidden; text-overflow: ellipsis; }
  .isobar .step { display: inline-flex; }
  .isobar .step[hidden] { display: none; }
  .isobar .step button { border-radius: 0; margin-left: -1px; }
  .isobar .step button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
  .isobar .step button:last-child { border-radius: 0 7px 7px 0; }
  .isobar .step #bAll { min-width: 4.6em; font-variant-numeric: tabular-nums; }
  .slide { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 0 8px; white-space: nowrap; }
  .slide[hidden] { display: none; }
  .slide input { width: 92px; accent-color: var(--accent); }
  .slide output { font: 11.5px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); min-width: 3em; }
  .mb .slide { border-left: 1px solid var(--rule); }
  .mb button[aria-disabled="true"] { opacity: 0.4; }
  .subs { list-style: none; margin: 0; padding: 0; }
  .subs button { width: calc(100% + 12px); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border: 0; background: none; text-align: left; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; font-size: 13px; cursor: default; }
  .subs button:hover { background: var(--soft); }
  .subs button { cursor: pointer; }
  .subs button.on { background: var(--chip); }
  .subs button.on span:first-child { font-weight: 600; }
  .subs .k { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: nowrap; }
  .subs .grp { font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 0 2px; }
  .subs .grp:first-child { padding-top: 0; }
  .fallback { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

  /* ---------- Inspector ---------- */
  .insp { grid-area: insp; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--chip); color: var(--ink); }
  .doc h2 { font-size: 19px; line-height: 1.25; margin: 2px 0 8px; font-weight: 650; }
  .doc h2 .count { font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); font-weight: 400; }
  .doc h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  .doc p { margin: 0 0 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

const scene = new THREE.Scene();
const DIST = 800;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, DIST - 420, DIST + 420);
camera.up.set(0, 0, 1);

// ---------- Materials: shaded colour, ink ids, and an x-ray ghost for context ----------
const shared = {
  uLight: { value: new V3(-0.42, 0.58, 0.7).normalize() },
  uCut: { value: new THREE.Color() },
  uInk: { value: new THREE.Color() },
  uLitColor: { value: new THREE.Color() },
  uPaper: { value: new THREE.Color() },
  uDpr: { value: 1 },
  uGhost: { value: 0.15 },
  uGlass: { value: 0.28 },
  // Hologram: the nearest surface's depth, the target size, time, scan-line density (per cm) and the sweep's height.
  tFront: { value: null },
  uRes: { value: new THREE.Vector2(1, 1) },
  uTime: { value: 0 },
  uScan: { value: 0.6 },
  uSweep: { value: -200 },
  // Port openings in the vessel wall (filled once the machine is built): axis + radius, base + length.
  uHoleA: { value: Array.from({ length: 12 }, () => new THREE.Vector4()) },
  uHoleP: { value: Array.from({ length: 12 }, () => new THREE.Vector4()) },
};
// Discards the vessel wall inside each port's cylinder, in the shell's own coordinates so the holes travel with it.
const HOLES = /* glsl */`
  #ifdef HOLES
    uniform vec4 uHoleA[12];
    uniform vec4 uHoleP[12];
    varying vec3 vObj;
    void holes() {
      for (int i = 0; i < 12; i++) {
        vec3 d = vObj - uHoleP[i].xyz;
        float s = dot(d, uHoleA[i].xyz);
        if (s > 0.0 && s < uHoleP[i].w) {
          vec3 q = d - s * uHoleA[i].xyz;
          if (dot(q, q) < uHoleA[i].w * uHoleA[i].w) discard;
        }
      }
    }
  #endif
`;

const VERT = /* glsl */`
  #include <clipping_planes_pars_vertex>
  varying vec3 vNv;
  varying vec3 vNw;
  varying vec3 vObj;
  varying vec3 vWp;
  void main() {
    vObj = position;
    vec4 p = vec4(position, 1.0);
    vec3 n = normal;
    #ifdef USE_INSTANCING
      p = instanceMatrix * p;
      n = mat3(instanceMatrix) * n;
    #endif
    vWp = (modelMatrix * p).xyz;
    vec4 mvPosition = modelViewMatrix * p;
    vNv = normalize(normalMatrix * n);
    vNw = normalize(mat3(modelMatrix) * n);
    gl_Position = projectionMatrix * mvPosition;
    #include <clipping_planes_vertex>
  }
`;

const FRAG_COLOR = /* glsl */`
  #include <clipping_planes_pars_fragment>
  ${HOLES}
  uniform vec3 uColor;
  uniform vec3 uLitColor;
  uniform float uLit;
  uniform vec3 uEmit;
  uniform vec3 uLight;
  uniform vec3 uCut;
  uniform vec3 uInk;
  uniform vec3 uPaper;
  uniform float uDpr;
  varying vec3 vNv;
  varying vec3 vNw;
  void main() {
    #include <clipping_planes_fragment>
    #ifdef HOLES
      holes();
    #endif
    if (!gl_FrontFacing) {
      float h = step(mod(gl_FragCoord.x - gl_FragCoord.y, 6.0 * uDpr), 1.0 * uDpr);
      gl_FragColor = vec4(mix(uCut, uInk, h * 0.5), 1.0);
      return;
    }
    vec3 n = normalize(vNv);
    float k = dot(n, uLight);
    float w = smoothstep(-0.4, 1.0, k);
    float top = smoothstep(0.6, 1.0, vNw.z);
    float tone = mix(0.66, 1.05, w) + 0.06 * top;
    vec3 c = uColor * tone;
    // A lit part keeps its own material: it only lightens toward the paper, and a thin accent rim, only at near-grazing
    // angles, outlines its silhouette (faces seen at a slant, like a former's fold-out tabs, stay copper). The levels
    // (hover 0.26-0.32, kept 0.42, hot 0.55) are spread over 0-1 so each reads apart: a higher one lightens more and
    // widens the rim a little. Stripes stay reserved for cut faces.
    if (uLit > 0.0) {
      float s = clamp((uLit - 0.2) / 0.3, 0.0, 1.0);
      float rim = smoothstep(0.85 - 0.2 * s, 1.0, 1.0 - abs(n.z));
      c = mix(c, uPaper, 0.04 + 0.4 * s);
      c = mix(c, uLitColor, rim * (0.6 + 0.4 * s));
    }
    gl_FragColor = vec4(c + uEmit, 1.0);
  }
`;

const FRAG_INK = /* glsl */`
  #include <clipping_planes_pars_fragment>
  ${HOLES}
  uniform float uId;
  varying vec3 vNv;
  varying vec3 vNw;
  void main() {
    #include <clipping_planes_fragment>
    #ifdef HOLES
      holes();
    #endif
    if (!gl_FrontFacing) { gl_FragColor = vec4(0.5, 0.5, 1.0, 1.0); return; }
    gl_FragColor = vec4(normalize(vNv) * 0.5 + 0.5, uId);
  }
`;

// The ghost is ink at a low alpha that thickens toward silhouettes, so the context reads as an x-ray outline.
// uSolid fills it back in with the part's own shading when the machine is put back together.
const FRAG_GHOST = /* glsl */`
  #include <clipping_planes_pars_fragment>
  uniform vec3 uInk;
  uniform float uGhost;
  uniform float uSolid;
  uniform vec3 uColor;
  uniform vec3 uLight;
  varying vec3 vNv;
  varying vec3 vNw;
  void main() {
    #include <clipping_planes_fragment>
    vec3 n = normalize(vNv);
    float rim = 1.0 - abs(n.z);
    float a = uGhost * (0.22 + 0.78 * pow(rim, 1.6));
    if (uSolid <= 0.0) { gl_FragColor = vec4(uInk, a); return; }
    float w = smoothstep(-0.4, 1.0, dot(n, uLight));
    vec3 c = uColor * (mix(0.66, 1.05, w) + 0.06 * smoothstep(0.6, 1.0, vNw.z));
    gl_FragColor = vec4(mix(uInk, c, uSolid), mix(a, 1.0, uSolid));
  }
`;

// The hologram: every surface adds a little blue light, brightest at grazing angles, crossed by scan lines and a slow sweep.
// Surfaces behind the nearest one (tFront is the ink pass's depth) are drawn faint, so the front reads first.
const FRAG_HOLO = /* glsl */`
  #include <clipping_planes_pars_fragment>
  ${HOLES}
  uniform vec3 uColor;
  uniform vec3 uLitColor;
  uniform float uLit;
  uniform vec3 uEmit;
  uniform vec3 uLight;
  uniform float uDim;
  uniform sampler2D tFront;
  uniform vec2 uRes;
  uniform float uTime;
  uniform float uScan;
  uniform float uSweep;
  varying vec3 vNv;
  varying vec3 vWp;
  void main() {
    #include <clipping_planes_fragment>
    #ifdef HOLES
      holes();
    #endif
    vec3 n = normalize(vNv);
    float rim = pow(1.0 - abs(n.z), 3.0);
    float w = smoothstep(-0.4, 1.0, abs(dot(n, uLight)));
    float behind = smoothstep(0.0003, 0.0015, gl_FragCoord.z - texture2D(tFront, gl_FragCoord.xy / uRes).x);
    float band = pow(fract(vWp.z * uScan - uTime * 0.35), 3.0);
    float sweep = exp(-pow((vWp.z - uSweep) / 2.5, 2.0));
    vec3 c = uColor * ((0.055 + 0.04 * w + 0.22 * rim) * (0.75 + 0.25 * band) + 0.12 * sweep);
    // The selection fills in amber, so it stands apart from the blue, and never goes white.
    float lit = clamp(uLit * 1.5, 0.0, 0.75);
    c = mix(c, uLitColor * (0.15 + 0.24 * rim) * (0.8 + 0.2 * band), lit);
    float vis = max(mix(1.0, 0.12, behind), lit * 0.45);
    gl_FragColor = vec4((c * vis + uEmit) * uDim, 1.0);
  }
`;

// Window glass is see-through: a faint tint, stronger at grazing angles, with a small glint.
const FRAG_GLASS = /* glsl */`
  #include <clipping_planes_pars_fragment>
  uniform vec3 uColor;
  uniform vec3 uLitColor;
  uniform float uLit;
  uniform vec3 uLight;
  uniform float uGlass;
  uniform float uLoose;
  varying vec3 vNv;
  varying vec3 vNw;
  void main() {
    #include <clipping_planes_fragment>
    vec3 n = normalize(vNv);
    float rim = pow(1.0 - abs(n.z), 2.0);
    float glint = pow(max(dot(n, uLight), 0.0), 14.0);
    vec3 c = mix(uColor, uLitColor, uLit) + vec3(0.4 * glint);
    gl_FragColor = vec4(c, uGlass * (0.5 + 0.5 * rim) * (1.0 + 1.4 * uLoose) + 0.3 * uLit + 0.2 * glint);
  }
`;

const sectorPlanes = [new THREE.Plane(new V3(0, 0, -1), 1e6), new THREE.Plane(), new THREE.Plane()];

const colorMats = new Map();
function colorMat(tone, clip) {
  const key = `${tone}|${clip ? 1 : 0}`;
  if (colorMats.has(key)) return colorMats.get(key);
  const glass = tone === 'glass';
  const m = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color() }, uLit: { value: 0 }, uEmit: { value: new THREE.Color(0, 0, 0) }, uDim: { value: 1 },
      uLight: shared.uLight, uCut: shared.uCut, uInk: shared.uInk, uLitColor: shared.uLitColor, uPaper: shared.uPaper, uDpr: shared.uDpr, uGlass: shared.uGlass, uLoose: { value: 0 },
      tFront: shared.tFront, uRes: shared.uRes, uTime: shared.uTime, uScan: shared.uScan, uSweep: shared.uSweep,
    },
    vertexShader: VERT, fragmentShader: glass ? FRAG_GLASS : FRAG_COLOR, side: glass ? THREE.FrontSide : THREE.DoubleSide,
    transparent: glass, depthWrite: !glass, clipping: true,
  });
  if (tone === 'vessel') { m.defines = { HOLES: 1 }; m.uniforms.uHoleA = shared.uHoleA; m.uniforms.uHoleP = shared.uHoleP; }
  m.userData.tone = tone;
  m.userData.clip = clip;
  colorMats.set(key, m);
  return m;
}
function inkMat(clip, holes) {
  const m = new THREE.ShaderMaterial({ uniforms: { uId: { value: 0 } }, vertexShader: VERT, fragmentShader: FRAG_INK, side: THREE.DoubleSide, clipping: true });
  if (holes) { m.defines = { HOLES: 1 }; m.uniforms.uHoleA = shared.uHoleA; m.uniforms.uHoleP = shared.uHoleP; }
  m.userData.ink = true;
  m.userData.clip = clip;
  return m;
}
const INK = { clip: inkMat(true), free: inkMat(false), clipHoles: inkMat(true, true), freeHoles: inkMat(false, true) };
// GHOST is the x-ray; GHOST_FADE is the same turning solid again, so it writes depth and takes each mesh's colour.
function ghostMat(fade) {
  const m = new THREE.ShaderMaterial({
    uniforms: { uInk: shared.uInk, uGhost: shared.uGhost, uLight: shared.uLight, uSolid: { value: 0 }, uColor: { value: new THREE.Color() } },
    vertexShader: VERT, fragmentShader: FRAG_GHOST, transparent: true, depthWrite: fade, side: THREE.FrontSide,
  });
  m.userData.ghost = true;
  m.userData.fade = fade;
  return m;
}
const GHOST = ghostMat(false), GHOST_FADE = ghostMat(true);

const solids = [];
// Small detail that only clutters the ghost of the context: holes, bolts, slots, rules, LEDs.
const FINE = new Set(['hole', 'bolt', 'slot', 'ink', 'tapeline', 'led', 'tip']);
let nextInk = 0;
const ZERO = new THREE.Color(0, 0, 0);

function perMesh(r, s, c, g, material) {
  const u = material.uniforms;
  if (material.userData.ghost) {
    if (!material.userData.fade) return;
    u.uColor.value.copy(this.userData.colorMat.uniforms.uColor.value);
    u.uSolid.value = this.userData.solid;
  } else if (material.userData.ink) u.uId.value = this.userData.inkId;
  else {
    u.uLit.value = this.userData.lit;
    u.uEmit.value.copy(this.userData.emit);
    u.uDim.value = this.userData.dim;
    // A window taken out of its flange is drawn more solid, so it reads as a part of its own.
    if (material.userData.tone === 'glass') u.uLoose.value = Math.min(1, this.position.length() / 3);
  }
  material.uniformsNeedUpdate = true;
}
function register(mesh, tone, o) {
  mesh.userData.part = o.part;
  mesh.userData.tone = tone;
  mesh.userData.lit = 0;
  mesh.userData.dim = 1;
  mesh.userData.solid = 0;
  mesh.userData.emit = ZERO.clone();
  mesh.userData.clip = !!o.clip;
  mesh.userData.colorMat = mesh.material;
  mesh.userData.inkMat = tone === 'vessel' ? (o.clip ? INK.clipHoles : INK.freeHoles) : o.clip ? INK.clip : INK.free;
  mesh.userData.inkId = ((nextInk++ % 250) + 2) / 255;
  mesh.onBeforeRender = perMesh;
  if (tone === 'glass') mesh.renderOrder = 10;
  solids.push(mesh);
}
function paint(geometry, tone, o) {
  const mesh = new THREE.Mesh(geometry, colorMat(tone, o.clip));
  register(mesh, tone, o);
  return mesh;
}
paint.instanced = (geometry, tone, matrices, o) => {
  const mesh = new THREE.InstancedMesh(geometry, colorMat(tone, o.clip), matrices.length);
  matrices.forEach((m, i) => mesh.setMatrixAt(i, m));
  mesh.instanceMatrix.needsUpdate = true;
  mesh.computeBoundingSphere();
  register(mesh, tone, o);
  return mesh;
};

// ---------- Build the machine ----------
const dev = window.SPM1Device.build(THREE, paint);
scene.add(dev.root);
const DIMS = dev.dims;
dev.holes.slice(0, 12).forEach((h, i) => {
  shared.uHoleA.value[i].set(h.a.x, h.a.y, h.a.z, h.r);
  shared.uHoleP.value[i].set(h.p.x, h.p.y, h.p.z, h.len);
});
const R0 = DIMS.R0;
{
  const a0 = DIMS.cut[0] * DEG, a1 = DIMS.cut[1] * DEG;
  sectorPlanes[1].set(new V3(Math.sin(a0), -Math.cos(a0), 0), 0);
  sectorPlanes[2].set(new V3(-Math.sin(a1), Math.cos(a1), 0), 0);
}
const firstInkOf = new Map();
for (const m of solids) if (!firstInkOf.has(m.userData.part)) firstInkOf.set(m.userData.part, m.userData.inkId);
for (const m of solids) if (m.userData.sameInkAs) m.userData.inkId = firstInkOf.get(m.userData.sameInkAs);
const groupByName = new Map(dev.groups.map((g) => [g.obj.name, g]));
for (const g of dev.groups) g.p = 0;

// Each piece: its meshes, its box at rest, the explode group that carries it and how it detaches.
function meshBox(m, out) {
  const g = m.geometry;
  if (!g.boundingBox) g.computeBoundingBox();
  if (m.isInstancedMesh) {
    const im = new THREE.Matrix4(), b = new THREE.Box3();
    for (let i = 0; i < m.count; i++) { m.getMatrixAt(i, im); b.copy(g.boundingBox).applyMatrix4(im).applyMatrix4(m.matrixWorld); out.union(b); }
  } else out.union(g.boundingBox.clone().applyMatrix4(m.matrixWorld));
  return out;
}
dev.root.updateMatrixWorld(true);
const pieces = dev.instances;
const piecesOf = new Map();
for (const pc of pieces) {
  const part = pc.userData.part;
  if (!piecesOf.has(part)) piecesOf.set(part, []);
  piecesOf.get(part).push(pc);
  const box = new THREE.Box3();
  pc.traverse((o) => { if (o.isMesh) { o.userData.piece = pc; o.userData.restBox = meshBox(o, new THREE.Box3()); box.union(o.userData.restBox); } });
  pc.userData.restBox = box;
  let g = pc.parent, eg = null;
  while (g && !eg) { eg = dev.groups.find((x) => x.obj === g) || null; g = g.parent; }
  pc.userData.egroup = eg;
  const spec = dev.detach[part] || {};
  let v;
  if (pc.userData.detach) v = pc.userData.detach.clone();
  else {
    v = new V3(0, 0, spec.lift || 0);
    const c = box.getCenter(new V3());
    const r = new V3(c.x, c.y, 0);
    if (spec.spread && r.lengthSq() > 1) v.add(r.normalize().multiplyScalar(spec.spread));
  }
  pc.userData.detachVec = v;
  pc.userData.dp = 0;
  pc.userData.tp = 0;
  pc.userData.ghost = false;
  // How ghosted it is drawn (1 x-ray, 0 solid), and when it may start home and turn solid after an inspect.
  pc.userData.gNow = 0;
  pc.userData.dHold = 0;
  pc.userData.gHold = 0;
}
// The named sub-parts of a part (or of one piece), in build order, with how many pieces carry each.
function subsOf(part, only) {
  const out = new Map();
  for (const pc of only ? [only] : piecesOf.get(part) || []) {
    const seen = new Set();
    pc.traverse((m) => { if (m.isMesh && m.userData.sub && !seen.has(m.userData.sub)) { seen.add(m.userData.sub); out.set(m.userData.sub, (out.get(m.userData.sub) || 0) + 1); } });
  }
  return out;
}
// Pieces are named by where they sit (device.js), never numbered. One without a label takes the part's name; one of
// several then cannot be told from the rest, so say so in development.
for (const [part, list] of piecesOf) for (const pc of list) {
  if (pc.userData.label) continue;
  pc.userData.label = partById.get(part)?.name || part;
  if (list.length > 1) console.warn(`Missing piece label: a piece of "${pc.userData.label}" (${part}) takes the part's name.`);
}

// ---------- Plasma glow (layer 1, no ink) and a soft floor shadow ----------
const GLOW_VERT = /* glsl */`
  uniform float uR0;
  uniform float uMinor;
  varying vec3 vNv;
  varying float vPhi;
  void main() {
    float phi = atan(position.y, position.x);
    vec3 c = vec3(uR0 * cos(phi), uR0 * sin(phi), 0.0);
    vec3 p = c + (position - c) * uMinor;
    vNv = normalize(normalMatrix * normal);
    vPhi = phi;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }
`;
const GLOW_FRAG = /* glsl */`
  uniform vec3 uCore;
  uniform vec3 uRim;
  uniform float uI;
  uniform float uTime;
  varying vec3 vNv;
  varying float vPhi;
  void main() {
    float f = abs(normalize(vNv).z);
    float core = pow(f, 1.6);
    float s = 1.0 - 0.12 * (0.5 - 0.5 * cos(vPhi * 22.0 - uTime * 0.8));
    float a = clamp(uI * (0.16 + 0.84 * core) * s, 0.0, 0.95);
    gl_FragColor = vec4(mix(uRim, uCore, core * core), a);
  }
`;
const torusUnit = new THREE.TorusGeometry(R0, 1, 40, 320);
const glow = [[1, 5.0], [1.38, 5.0]].map(([sc, minor], i) => {
  const mat = new THREE.ShaderMaterial({
    uniforms: { uR0: { value: R0 }, uMinor: { value: minor * sc }, uCore: { value: new THREE.Color('#ffe2f6') }, uRim: { value: new THREE.Color('#b84ad6') }, uI: { value: 0 }, uTime: { value: 0 } },
    vertexShader: GLOW_VERT, fragmentShader: GLOW_FRAG, transparent: true, depthWrite: false,
  });
  mat.userData.scale = sc;
  const mesh = new THREE.Mesh(torusUnit, mat);
  mesh.layers.set(1);
  mesh.renderOrder = 2 + i;
  scene.add(mesh);
  return mesh;
});

// In the hologram the shadow becomes the projector's floor: rings every 10 cm, spokes, and a pulse running outward.
const shadow = (() => {
  const mat = new THREE.ShaderMaterial({
    uniforms: { uInk: { value: new THREE.Color(0, 0, 0) }, uA: { value: 0.12 }, uHolo: { value: 0 }, uTime: shared.uTime },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: /* glsl */`
      uniform vec3 uInk; uniform float uA; uniform float uHolo; uniform float uTime; varying vec2 vUv;
      void main() {
        vec2 q = (vUv - 0.5) * 2.0;
        if (uHolo > 0.5) {
          vec2 x = q * 120.0;
          float d = length(x);
          float px = fwidth(d) * 1.2;
          float ring = 1.0 - smoothstep(0.0, px, abs(fract(d / 10.0 + 0.5) - 0.5) * 10.0);
          float arc = abs(fract(atan(x.y, x.x) / 6.2831853 * 24.0 + 0.5) - 0.5) / 24.0 * 6.2831853 * d;
          float spoke = (1.0 - smoothstep(0.0, px, arc)) * smoothstep(12.0, 22.0, d);
          float fade = 1.0 - smoothstep(25.0, 105.0, d);
          float pulse = exp(-pow(d - mod(uTime * 14.0, 130.0), 2.0) / 18.0);
          float glow = exp(-d / 34.0);
          gl_FragColor = vec4(uInk * (fade * (0.32 * ring + 0.14 * spoke + 0.35 * pulse * ring) + 0.09 * glow) * uA, 1.0);
          return;
        }
        float t = 1.0 - smoothstep(0.22, 0.62, max(abs(q.x), abs(q.y)) * 0.75 + length(q) * 0.25);
        gl_FragColor = vec4(uInk, uA * t);
      }
    `,
    transparent: true, depthWrite: false,
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), mat);
  m.position.z = DIMS.table.floor + 0.02;
  m.layers.set(1);
  scene.add(m);
  return mat;
})();

// ---------- Post-processing: colour, then normals + ids + depth, then ink ----------
const post = (() => {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      tColor: { value: null }, tNid: { value: null }, tDepth: { value: null },
      uTexel: { value: new THREE.Vector2() }, uThick: { value: 1 }, uInk: shared.uInk,
      uRange: { value: camera.far - camera.near }, uDepthT: { value: 0.45 }, uInkAlpha: { value: 0.9 },
      uHolo: { value: 0 }, uDpr: shared.uDpr,
    },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: /* glsl */`
      uniform sampler2D tColor;
      uniform sampler2D tNid;
      uniform sampler2D tDepth;
      uniform vec2 uTexel;
      uniform float uThick;
      uniform vec3 uInk;
      uniform float uRange;
      uniform float uDepthT;
      uniform float uInkAlpha;
      uniform float uHolo;
      uniform float uDpr;
      varying vec2 vUv;
      float dep(vec2 uv) { return texture2D(tDepth, uv).x * uRange; }
      vec3 nrm(vec4 t) { return t.a > 0.0 ? normalize(t.xyz * 2.0 - 1.0) : vec3(0.0); }
      void probe(vec2 uv, vec4 c, vec3 nc, inout float lap, inout float ne, inout float ide) {
        vec4 t = texture2D(tNid, uv);
        lap += dep(uv);
        if (c.a > 0.0 && t.a > 0.0) ne = max(ne, 1.0 - dot(nc, nrm(t)));
        ide = max(ide, step(0.0015, abs(t.a - c.a)));
      }
      float edge(float s) {
        vec2 ox = vec2(uTexel.x * s, 0.0);
        vec2 oy = vec2(0.0, uTexel.y * s);
        vec4 c = texture2D(tNid, vUv);
        vec3 nc = nrm(c);

  b.type = 'button';
  if (fk) b.dataset.fk = fk;
  b.addEventListener('click', fn);
  return b;
}
let inspShown = '';
// The inspector is rebuilt on every change. Focus stays on the control it was on (by its data-fk), or goes to the
// part's name when that control is gone.
function renderInspector() {
  const box = $('inspBody');
  // A new part or piece starts at the top, so its name is in view; any other re-render keeps the reader's place.
  const shown = `${state.select}|${iso.focus ? iso.focus.id : ''}`;
  if (shown !== inspShown) { inspShown = shown; box.scrollTop = 0; }
  const fk = box.contains(document.activeElement) ? document.activeElement.dataset.fk : null;
  box.replaceChildren();
  if (tab === 'sources') renderSources(box);
  else if (tab === 'help') renderHelp(box);
  else if (!state.select) renderOverview(box);
  else renderPart(box, false);
  if (fk) (box.querySelector(`[data-fk="${CSS.escape(fk)}"]`) || box.querySelector('h2'))?.focus({ preventScroll: true });
}
// The piece in view, by its place, and which of how many it is.
function pieceLine(p) {
  const list = piecesOf.get(p.id) || [];
  return iso.part === p.id && iso.focus ? `${iso.focus.userData.label} · ${list.indexOf(iso.focus) + 1} of ${list.length}` : null;
}
// The component, in one order wherever it shows: the Part tab, or the part card in the sheet column or the dock (`card`,
// whose bar names it). Its actions, then name and piece, what it is drawn from, what it does, what it connects to,
// what it is made of, its pieces, its specification, practical notes, its sources, and one key to the tags used.
function renderPart(box, card) {
  const p = partById.get(card ? iso.part : state.select);
  const here = iso.part === p.id;
  if (!card) {
    // The actions come first, so "Inspect on its own" is the first control in the tab.
    const acts = el('div', 'actions');
    if (here) {
      acts.append(action('Back to assembly', endInspect, true, 'act:done'));
      if (p.id !== 'plasma') acts.append(action(iso.apart ? 'Put back together' : 'Take apart', () => setApart(!iso.apart), false, 'act:apart'));
    } else acts.append(action('Inspect on its own', () => inspect(p.id), true, 'act:inspect'), action('Zoom to it', () => zoomToPart(p.id), false, 'act:zoom'));
    acts.append(action(hidden.has(p.id) ? 'Show' : 'Hide', () => { setHidden([p.id], !hidden.has(p.id)); renderInspector(); }, false, 'act:hide'));
    box.append(acts);
    const grp = DOCS.GROUPS.find((g) => g.id === p.group);
    box.append(el('div', 'eyebrow', `${grp.name} · part ${p.n} of ${DOCS.PARTS.length}`));
    const h = el('h2', null, p.name);
    h.tabIndex = -1;
    h.dataset.fk = 'name';
    if (p.count > 1 && !(here && iso.focus)) h.append(' ', el('span', 'count', `×${p.count}`));
    box.append(h);
    const line = pieceLine(p);
    if (line) box.append(el('div', 'piece-of', line));
  }
  const chips = el('div', 'chips');
  const c = el('span', 'chip');
  c.title = BASIS_TIP;
  c.append(el('span', `basis ${p.basis}`), BASIS[p.basis]);
  chips.append(c);
  box.append(chips);
  box.append(el('p', null, p.what));
  if (p.connects?.length) {
    box.append(el('h3', null, 'Connects to'));
    const cc = el('div', 'chips');
    for (const id of p.connects) {
      const q = partById.get(id);
      if (!q) continue;
      const b = el('button', 'chip', q.name);
      b.type = 'button';
      b.dataset.fk = `link:${id}`;
      b.title = here ? `Inspect the ${q.name.toLowerCase()}` : `Read about the ${q.name.toLowerCase()}`;
      b.addEventListener('click', () => followLink(id));
      b.addEventListener('mouseenter', () => { state.legendHot = id; refreshLit(); });
      b.addEventListener('mouseleave', () => { state.legendHot = null; refreshLit(); });
      cc.append(b);
    }
    box.append(cc);
  }
  const subs = subsList(p);
  if (subs) box.append(el('h3', null, here && iso.apart ? 'Taken apart into' : 'Made of'), subs);
  box.append(...piecesTable(p));
  box.append(el('h3', null, 'Specification'), specTable(p.specs));
  // A part made of one sub-part (a gasket) shows that sheet's numbers here, so they need no second click.
  const only = [...subsOf(p.id).keys()];
  const doc = only.length === 1 ? subDocOf(p.id, only[0]) : null;
  if (doc?.rows.length) box.append(el('h3', null, doc.title), specTable(doc.rows));
  if (p.know) {
    box.append(el('h3', null, 'Good to know'));
    box.append(el('p', 'know', p.know));
  }
  box.append(el('h3', null, 'Sources'));
  const ul = el('ul', 'srclist');
  for (const id of p.sources) {
    const s = srcById.get(id);
    const li = el('li');
    li.append(refButton(id), ' ');
    const a = el('a', null, s.title);
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
    li.append(a);
    ul.append(li);
  }
  box.append(ul);
  tagKey(box);
}
// What a part is made of. Each row keeps its sub-part's sheet, or closes it if it is kept; hovering one lights it. A
// repeated part lists its sub-parts once, with how many pieces carry each. A part made of different objects (a supply
// and its two leads) lists each object's sub-parts under its name. With one piece in view, that piece's.
function subsList(p) {
  const here = iso.part === p.id;
  const list = piecesOf.get(p.id) || [];
  const inView = here && iso.focus ? [iso.focus] : list;
  const ul = el('ul', 'subs');
  const row = (name, k) => {
    const on = here && isPinned({ part: p.id, sub: name });
    const b = el('button', on ? 'on' : null);
    b.type = 'button';
    b.dataset.fk = `sub:${name}`;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.title = on ? 'Close its sheet' : 'Keep its sheet';
    b.append(el('span', null, name));
    if (k) b.append(el('span', 'k', k));
    b.addEventListener('click', (e) => toggleSub(p.id, name, !e.detail));
    b.addEventListener('mouseenter', () => { state.hoverSub = name; refreshLit(); });
    b.addEventListener('mouseleave', () => { state.hoverSub = null; refreshLit(); });
    const li = el('li');
    li.append(b);
    ul.append(li);
  };
  if (p.count < 2 && list.length > 1) {
    for (const pc of inView) {
      const subs = subsOf(p.id, pc);
      if (!subs.size) continue;
      ul.append(el('li', 'grp', pc.userData.label));
      for (const name of subs.keys()) row(name);
    }
  } else {
    const n = inView.length;
    for (const [name, count] of subsOf(p.id, here ? iso.focus : null)) row(name, n > 1 ? (count === n ? `on all ${n}` : `on ${count} of ${n}`) : null);
  }
  return ul.children.length ? ul : null;
}
// A repeated part's pieces (`count` > 1), one row each, named by where it sits, with what the sources tell apart for
// each and its tag. The piece in view is marked, and a click on a row goes to that piece, like ‹ ›. Where the sources
// tell them no differently, one line says so. A part made of different objects has none: they are not copies.
function piecesTable(p) {
  const list = piecesOf.get(p.id) || [];
  if (p.count < 2 || list.length < 2) return [];
  const here = iso.part === p.id;
  const fields = [];
  for (const rows of Object.values(p.pieces || {})) for (const [f] of rows) if (!fields.includes(f)) fields.push(f);
  const t = el('table', 'ptab');
  if (fields.length) {
    const head = el('thead');
    const tr = el('tr');
    tr.append(el('th', null, 'Where it sits'), ...fields.map((f) => el('th', null, f)));
    head.append(tr);
    t.append(head);
  }
  const tb = el('tbody');
  for (const pc of list) {
    const on = here && iso.focus === pc;
    const tr = el('tr', on ? 'on' : null);
    const b = el('button', null, pc.userData.label);
    b.type = 'button';
    b.dataset.fk = `piece:${pc.id}`;
    b.title = on ? 'The piece in view' : 'Go to this piece';
    if (on) b.setAttribute('aria-current', 'true');
    const td = el('td');
    td.append(b);
    tr.append(td);
    for (const f of fields) {
      const r = p.pieces?.[pc.userData.label]?.find((x) => x[0] === f);
      const v = el('td');
      if (r) v.append(r[1], ' ', refButton(r[2])); else v.append('–');
      tr.append(v);
    }
    tr.addEventListener('click', (e) => { if (!e.target.closest('.ref')) focusPiece(pc); });
    tr.addEventListener('mouseenter', () => { state.rowPiece = pc; refreshLit(); });
    tr.addEventListener('mouseleave', () => { state.rowPiece = null; refreshLit(); });
    tb.append(tr);
  }
  t.append(tb);
  const out = [el('h3', null, `Pieces (${list.length})`), t];
  if (!fields.length) out.push(el('p', 'note', `The sources give no difference between these ${list.length}; they differ only by place.`));
  return out;
}
// The overview's headline numbers. A row can cite more than one source, and each gets its own tag.
const HEADLINE = [
  ['Major / minor radius', '230 mm / 75 mm', ['S2', 'S3']],
  ['Vessel', '4 × 150 mm elbows, ConFlat', ['S1']],
  ['Ports', '3 viewing, 1 vacuum, 4 diagnostic', ['S1']],
  ['TF coils', '8 × 50 turns, 40 A each', ['S1']],
  ['TF field', '0.025 T CW, 0.1 T pulsed', ['S2', 'S3']],
  ['PF coils', '4 + 2 satellites', ['S1']],
  ['Plasma', '1–5 eV glow in N₂ or He', ['S2', 'S3']],
  ['Envelope', '90 × 90 × 160 cm', ['S2', 'S3']],
];
// How many rows cite each source: the parts' spec and piece rows, the sheets' rows, the not-drawn list and the
// headline numbers. A row citing two sources counts for each; a list of sources is not a row, and `std` is not S9.
const citedBy = (() => {
  const n = new Map();
  const add = (ids) => { for (const id of [].concat(ids)) if (id) n.set(id, (n.get(id) || 0) + 1); };
  for (const p of DOCS.PARTS) {
    for (const r of p.specs) add(r[2]);
    for (const rows of Object.values(p.pieces || {})) for (const r of rows) add(r[2]);
  }
  for (const d of Object.values(DOCS.SUBDOCS)) for (const r of d.rows) add(r[2]);
  for (const r of DOCS.NOT_DRAWN) add(r[2]);
  for (const r of HEADLINE) add(r[2]);
  return n;
})();

function renderSources(box) {

function setExplode(on) {

$('themeBtn').addEventListener('click', () => {
  const next = themeName() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  store.set('spm1-theme', next);

systemDark.addEventListener('change', applyTheme);

function applyTheme() {
  const t = themeName();
  const pal = THEME[t];
  holo = t === 'dark';
  document.documentElement.classList.toggle('holo', holo);
  for (const m of colorMats.values()) {
    const glass = m.userData.tone === 'glass';
    m.uniforms.uColor.value.copy(toneColor(m.userData.tone, t));
    m.fragmentShader = holo ? FRAG_HOLO : glass ? FRAG_GLASS : FRAG_COLOR;
    m.blending = holo ? THREE.AdditiveBlending : THREE.NormalBlending;
    m.transparent = holo || glass;
    m.depthWrite = !holo && !glass;
    m.needsUpdate = true;
  }
  post.mat.uniforms.uHolo.value = holo ? 1 : 0;
  shadow.uniforms.uHolo.value = holo ? 1 : 0;
  shadow.blending = holo ? THREE.AdditiveBlending : THREE.NormalBlending;
  shadow.needsUpdate = true;
  shared.uCut.value.set(pal.cut);
  shared.uInk.value.set(pal.ink);
  shared.uLitColor.value.set(pal.lit);
  shared.uPaper.value.set(pal.paper);
  shared.uGhost.value = pal.ghost;
  shared.uGlass.value = pal.glass;
  post.mat.uniforms.uInkAlpha.value = pal.inkAlpha;
  shadow.uniforms.uA.value = pal.shadow;
  shadow.uniforms.uInk.value.set(pal.shadowInk);
  for (const g of glow) {
    const u = g.material.uniforms;
    u.uCore.value.set(holo ? '#ff8fe8' : '#ffe2f6');
    u.uRim.value.set(holo ? '#b03cff' : '#b84ad6');
    g.material.blending = holo ? THREE.AdditiveBlending : THREE.NormalBlending;
    g.material.needsUpdate = true;
  }
  $('themeLbl').textContent = holo ? 'Light' : 'Hologram';
  $('themeBtn').title = holo ? 'Switch to the light drawing' : 'Switch to the hologram';
  applyLook();
  dirty = true;
}

// ---------- Orientation triad and scale bar ----------
const triad = $('triad');
const AXES = [
  { k: 'x', v: new V3(1, 0, 0), c: '#d9412f', view: 'right' },
  { k: 'y', v: new V3(0, 1, 0), c: '#2b8a6e', view: 'back' },
  { k: 'z', v: new V3(0, 0, 1), c: '#2d67cf', view: 'top' },
  { k: '−x', v: new V3(-1, 0, 0), c: '#d9412f', view: 'left' },
  { k: '−y', v: new V3(0, -1, 0), c: '#2b8a6e', view: 'front' },
  { k: '−z', v: new V3(0, 0, -1), c: '#2d67cf', view: 'bottom' },
];
function drawTriad() {
  const { dir, right, up } = basis(view.az, view.el);
  const R = 27;
  const items = AXES.map((a) => ({ ...a, x: a.v.dot(right) * R, y: -a.v.dot(up) * R, d: a.v.dot(dir) })).sort((a, b) => a.d - b.d);
  let s = '<circle class="ring" r="39"/>';
  for (const a of items) {
    const neg = a.k.startsWith('−');
    s += `<g class="ax" data-view="${a.view}" role="button" aria-label="Look from ${a.view}" opacity="${0.55 + 0.45 * (a.d * 0.5 + 0.5)}">`;
    if (!neg) s += `<line x1="0" y1="0" x2="${a.x.toFixed(1)}" y2="${a.y.toFixed(1)}" stroke="${a.c}" stroke-width="2"/>`;
    s += `<circle cx="${a.x.toFixed(1)}" cy="${a.y.toFixed(1)}" r="${neg ? 4 : 7}" fill="${neg ? 'var(--card)' : a.c}" stroke="${a.c}" stroke-width="1.5"/>`;
    if (!neg) s += `<text x="${a.x.toFixed(1)}" y="${(a.y + 3.4).toFixed(1)}" text-anchor="middle" style="fill:#fff">${a.k}</text>`;
    s += '</g>';
  }
  triad.innerHTML = s;
}
triad.addEventListener('click', (e) => {
  const g = e.target.closest('[data-view]');
