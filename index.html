<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPM1 Anatomy</title>
<meta name="description" content="An interactive anatomy of the MinimaK SPM1 simple magnetised torus: turn it like a turntable, take it apart, inspect each component on its own and read where every number comes from.">
<style>
  :root {
    --paper: #f1f1ef;
    --card: #fafaf9;
    --ink: #1c1c1a;
    --muted: #5c5c59;
    --rule: #d9d9d5;
    --soft: #eeeeeb;
    --chip: #e6e6e2;
    --accent: #0a736e;
    --spec: #2b8a6e;
    --photo: #9a6a0f;
    --assumed: #787873;
    color-scheme: light;
  }
  /* The dark theme is a hologram. The class is set before first paint (script below) and by applyTheme. */
  :root.holo {
    --paper: #03080f;
    --card: #06121e;
    --ink: #cfe3f2;
    --muted: #7a9fb9;
    --rule: #16314a;
    --soft: #0a1b2a;
    --chip: #0e2436;
    --accent: #6fb8e8;
    --spec: #3cf0b4;
    --photo: #ffb54d;
    --assumed: #6a8ea8;
    color-scheme: dark;
    scrollbar-color: #1b3a55 transparent;
  }
  /* The greyscale drawing: a shaded black-and-white rendering on dimmed paper. Amber marks the selection, as in the
     hologram, and nothing else, so the accent (focus rings, the tour's rule) is ink. The basis dots keep their shapes. */
  :root.greyscale {
    --paper: #b9b9b5;
    --card: #cbcbc7;
    --ink: #121212;
    --muted: #3f3f3d;
    --rule: #a5a5a1;
    --soft: #c1c1bd;
    --chip: #b5b5b1;
    --accent: #121212;
    --spec: #1f1f1e;
    --photo: #1f1f1e;
    --assumed: #3f3f3d;
    --amber: #e8901c;
    color-scheme: light;
    scrollbar-color: #8f8f8b transparent;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  /* Read by screen readers, never seen: the one status line. Pinned to the top-left corner of its containing block, so
     wherever it sits (even last in the body) it adds no scrollable overflow. */
  .sr-only { position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: 0; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

  /* ---------- App shell: tree | viewer | inspector, each scrolls on its own ---------- */
  .app {
    --tw: 260px; --iw: clamp(300px, 23vw, 360px);
    display: grid; height: 100vh; height: 100dvh; row-gap: 12px; padding: 12px 16px 16px;
    grid-template-columns: var(--tw) 10px minmax(0, 1fr) 10px var(--iw);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top top top top top" "tree gl view gr insp";
  }
  .top { grid-area: top; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand { flex: none; line-height: 1.2; }
  /* The page's one h1: the machine's name, then what this is. */
  .brand h1 { margin: 0; font-size: 20px; line-height: 1.15; font-weight: 650; letter-spacing: -0.01em; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  /* The tools wrap to a second row rather than scroll out of sight. */
  .modebar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; align-items: center; margin-left: auto; padding: 2px; }
  .mb { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; background: var(--card); overflow: hidden; flex: none; }
  .mb button { position: relative; border: 0; background: transparent; padding: 6px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 1; white-space: nowrap; }
  .mb button + button { border-left: 1px solid var(--rule); }
  .mb button:hover { background: var(--soft); }
  .mb button[aria-pressed="true"]:not(.toggle), .mb button[aria-checked="true"] { background: var(--ink); color: var(--card); }
  /* A toggle is a switch: the button stays as it is and its switch says on or off, by the knob's side and its fill, so
     a toggle that is on never looks like an action (Done, Next), which alone is filled. */
  .sw { position: relative; display: inline-block; flex: none; width: 22px; height: 12px; margin-left: 2px; border: 1.5px solid currentColor; border-radius: 7px; opacity: 0.6; vertical-align: -2px; box-sizing: border-box; }
  .sw::after { content: ''; position: absolute; top: 1.5px; left: 1.5px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; transition: transform 0.15s; }
  [aria-pressed="true"] > .sw { opacity: 1; background: var(--accent); border-color: var(--accent); }
  [aria-pressed="true"] > .sw::after { transform: translateX(10px); background: var(--card); }
  @media (prefers-reduced-motion: reduce) { .sw::after { transition: none; } }
  .mb svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  /* Under 1440 px the theme buttons not chosen show only their icons, and under 1320 px the chosen one too, so the
     modebar keeps to one row on a laptop, Spread slider included. A label that is not shown still names its button. */
  @media (max-width: 1440px) {
    .mb[role="radiogroup"] button[aria-checked="false"] .lbl { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  }
  @media (max-width: 1320px) {
    .mb[role="radiogroup"] .lbl { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  }
  button:focus-visible, input:focus-visible, .stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* On a touch screen every control is at least 44 px, except the tags and explained words set inside the text. */
  @media (pointer: coarse) { button:not(.term):not(.ref) { min-height: 44px; min-width: 44px; } }
  /* The view clips what sticks out of it, so its own focus ring is drawn inside its edge. */
  .stage:focus-visible { outline-offset: -4px; }
  /* Text size (Controls tab): the inspect bar, the sheets and the view's labels grow together. */
  .isobar, .sheets-head, .screen, .corner, .tip { zoom: var(--ui-scale, 1); }
  /* The group clips its buttons, so a button's ring is drawn inside it, on a band of the card that shows on a pressed
     button too. */
  .mb button:focus-visible { outline-offset: -2px; box-shadow: inset 0 0 0 4px var(--card); }

  .panel { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  /* Either side panel folds to a thin rail, to give the model and its screens the room. */
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .fold { flex: none; width: 26px; height: 24px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 17px; line-height: 1; }
  .fold:hover { background: var(--chip); color: var(--ink); }
  .rail, .rail-search { display: none; }
  .panel.folded .rail-search { display: grid; place-items: center; height: 34px; margin: 6px 4px 0; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; }
  .panel.folded .rail-search:hover { background: var(--soft); color: var(--ink); }
  .rail-search svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  /* The grip between a panel and the view sizes the panel; a line shows while it is hovered or dragged. */
  .grip { position: relative; cursor: col-resize; touch-action: none; outline: none; }
  .grip.left { grid-area: gl; }
  .grip.right { grid-area: gr; }
  .grip::after { content: ""; position: absolute; top: 8px; bottom: 8px; left: 4px; width: 2px; border-radius: 1px; background: var(--accent); opacity: 0; transition: opacity .15s; }
  .grip:hover::after, .grip.on::after, .grip:focus-visible::after { opacity: 0.7; }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing .stage { pointer-events: none; }
  .app.fold-tree { --tw: 34px; }
  .app.fold-insp { --iw: 34px; }
  .panel.folded > :not(.rail):not(.rail-search) { display: none; }
  .panel.folded .rail { display: block; flex: 1; border: 0; background: none; cursor: pointer; writing-mode: vertical-rl; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 12px 0; }
  .panel.folded .rail:hover { color: var(--ink); background: var(--soft); }
  .panel-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--rule); }
  .panel-body { overflow-y: auto; overscroll-behavior: contain; padding: 8px 12px 14px; flex: 1; min-height: 0; }
  /* A small label: sentence case in the muted ink, never tracked capitals. */
  .eyebrow { font-size: 12.5px; color: var(--muted); font-weight: 600; }

  /* The first Tab stop: hidden until focused, it jumps to the assembly list. */
  .skip { position: absolute; left: 10px; top: -60px; z-index: 10; background: var(--ink); color: var(--card); padding: 6px 12px; border-radius: 8px; font-size: 13px; text-decoration: none; }
  .skip:focus { top: 10px; }

  /* ---------- Assembly tree ---------- */
  /* One Tab stop (the ARIA tree pattern): the groups and part rows are tree items that take focus in turn. */
  .tree { grid-area: tree; }
  .search-note { margin: 5px 2px 0; font-size: 12px; line-height: 1.35; color: var(--muted); }
  .search-note[hidden] { display: none; }
  .search-note b { color: var(--ink); font-weight: 600; }
  .search { width: 100%; margin-top: 8px; font: inherit; font-size: 13px; color: var(--ink); background: var(--soft); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 9px; }
  .tree-root { list-style: none; margin: 0; padding: 0; }
  .tg { margin-top: 6px; }
  .tg-head { display: flex; align-items: center; gap: 2px; border-radius: 7px; }
  .tree-root .tg-head { cursor: pointer; }
  .tg-head .caret { flex: 1; display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 2px; cursor: pointer; text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .tg-head .caret::before { content: ""; width: 0; height: 0; border-left: 4px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; transform: rotate(90deg); }
  .tg.closed .tg-head .caret::before { transform: rotate(0); }
  .tg.closed ul { display: none; }
  .tg ul { list-style: none; margin: 0; padding: 0; }
  .tg:focus { outline: none; }
  .tg:focus-visible > .tg-head, .ti:focus-visible, .ti-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ti { display: flex; align-items: center; gap: 2px; border-radius: 7px; cursor: pointer; }
  .ti:hover, .ti.hot { background: var(--soft); }
  .ti.sel { background: var(--chip); }
  .ti .name { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 7px; padding: 5px 4px; text-align: left; font-size: 13px; }
  .ti .name span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti .n { font-size: 11.5px; color: var(--muted); min-width: 1.4em; text-align: right; font-variant-numeric: tabular-nums; }
  .ti .cnt { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ti-hit { padding: 3px 4px 3px 52px; border-radius: 7px; font-size: 12px; cursor: pointer; color: var(--ink); overflow-wrap: anywhere; }
  .ti-hit:hover { background: var(--soft); }
  .ti-hit.more { padding: 2px 4px 4px 52px; font-size: 11.5px; color: var(--muted); cursor: default; }
  .ti-hit.more:hover { background: none; }
  .eye { flex: none; width: 26px; height: 24px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
  .eye:hover { color: var(--ink); background: var(--chip); }
  .eye svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  .eye[aria-pressed="false"] { opacity: 0.45; }
  .ti.off .name { opacity: 0.45; }
  .basis { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; border: 1.5px solid; }
  .basis.spec { background: var(--spec); border-color: var(--spec); }
  .basis.photo { background: linear-gradient(90deg, var(--photo) 50%, transparent 50%); border-color: var(--photo); }
  .basis.assumed { border-color: var(--assumed); }
  .legend-basis { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); padding: 10px 2px 2px; border-top: 1px solid var(--rule); margin-top: 12px; }
  .legend-basis div { display: flex; align-items: center; }
  .nd { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; padding: 0; list-style: none; }
  .nd li { padding: 3px 4px; display: flex; gap: 8px; justify-content: space-between; }
  .nd li span:last-child { font-size: 11.5px; white-space: nowrap; }

  /* ---------- Viewer card ---------- */
  .view { grid-area: view; position: relative; margin: 0; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; min-height: 0; }
  .stage { position: absolute; inset: 0; cursor: grab; touch-action: none; outline: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  /* The loupe: a finger held still shows the view under it at 3×, with the name of what it is on, above the finger. */
  .loupe { position: absolute; z-index: 6; width: 132px; display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; }
  .loupe[hidden] { display: none; }
  .loupe canvas { width: 132px; height: 132px; border-radius: 50%; border: 2px solid var(--accent); background: var(--card); box-shadow: 0 6px 22px rgb(0 0 0 / 0.28); }
  .loupe::after { content: ''; position: absolute; bottom: 66px; left: 66px; width: 12px; height: 12px; margin: 0 0 -6px -6px; border: 1.5px solid var(--accent); border-radius: 50%; box-shadow: 0 0 0 1.5px var(--card); }
  .loupe span { max-width: 240px; padding: 3px 9px; border: 1px solid var(--rule); border-radius: 7px; background: var(--card); color: var(--ink); font-size: 13px; font-weight: 600; line-height: 1.3; text-align: center; box-shadow: 0 2px 8px rgb(0 0 0 / 0.12); }
  .loupe span:empty { display: none; }
  .loupe span small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .stage.pan { cursor: move; }
  .stage.dragging { cursor: grabbing; }
  .stage.pointing { cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .corner { position: absolute; font-size: 12px; line-height: 1.35; font-variant-numeric: tabular-nums; color: var(--muted); pointer-events: none; }
  .corner.tl { top: 12px; left: 14px; color: var(--ink); }
  .corner.tl span { color: var(--muted); }
  /* The hint stops short of the sheet column (--hud-r). Lengths on a zoomed box are scaled by its zoom, so the inset is divided back. */
  .corner.bl { --bl-max: 60%; bottom: 10px; left: 12px; max-width: min(var(--bl-max), calc(100% - (var(--hud-r, 0px) + 24px) / var(--ui-scale, 1))); }
  .corner.br { bottom: 10px; right: 12px; text-align: right; color: var(--ink); max-width: 38%; }
  .corner.bl .hint, .corner.br { background: color-mix(in srgb, var(--card) 84%, transparent); padding: 3px 6px; border-radius: 6px; }
  /* The scale bar on the same backing as the hint, so its length reads over a dark part of the machine. */
  .scale { display: flex; align-items: flex-end; gap: 6px; width: fit-content; margin: 0 0 6px; padding: 3px 6px; border-radius: 6px; background: color-mix(in srgb, var(--card) 84%, transparent); color: var(--ink); }
  .scale i { display: block; height: 7px; border: 1.5px solid var(--ink); border-top: 0; }
  .triad { position: absolute; top: 8px; right: 8px; width: 84px; height: 84px; }
  /* The view's own controls, at its left edge and clear of what is framed: zoom, the home view, Views, pan, panels. */
  .navcluster { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); z-index: 3; display: flex; flex-direction: column; gap: 8px; }
  .navcluster .mb { flex-direction: column; }
  .navcluster .mb button { justify-content: center; padding: 8px; }
  .navcluster .mb button + button { border-left: 0; border-top: 1px solid var(--rule); }
  .navcluster .mb button[aria-pressed="true"] { background: var(--chip); color: var(--ink); }
  .vmenu { position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; min-width: 150px; padding: 4px; border: 1px solid var(--rule); border-radius: 9px; background: var(--card); box-shadow: 0 6px 20px rgb(0 0 0 / 0.14); }
  .vmenu[hidden] { display: none; }
  .vmenu button { display: flex; justify-content: space-between; gap: 16px; padding: 6px 10px; border: 0; border-radius: 6px; background: none; text-align: left; font-size: 13px; cursor: pointer; }
  .vmenu button:hover, .vmenu button:focus-visible { background: var(--soft); outline: none; }
  .vmenu button span { color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (pointer: coarse) { .navcluster .zoom { display: none; } }
  .triad text { font-size: 10px; font-weight: 650; fill: var(--ink); cursor: pointer; }
  .triad .ax { cursor: pointer; }
  .triad .ax:hover circle { stroke-width: 2.4; }
  .triad .ring { fill: color-mix(in srgb, var(--card) 70%, transparent); stroke: var(--rule); }
  .tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--card); font-size: 12px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; transform: translate(12px, 14px); opacity: 0; transition: opacity .12s; }
  .tip.on { opacity: 0.94; }
  .tip small { opacity: 0.7; margin-left: 6px; }
  /* Information screens. While inspecting, the sheet column on the right of the view holds, in order, the part card
     (when the Part tab is not beside the view), the kept sheets and the preview. Its room is kept even while it is
     empty, so nothing in it moves the camera. It scrolls; nothing in it folds or closes by itself. A view under 660 px
     has a bottom sheet instead, one card at a time. A sheet dragged out floats where it is dropped. */
  .hud { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .hud[hidden] { display: none; }
  .sheets { position: absolute; top: 80px; right: 12px; bottom: 8px; width: calc(280px * var(--ui-scale, 1)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .sheets-head {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px 4px 4px 10px; border-radius: 10px; pointer-events: auto;
    background: color-mix(in srgb, var(--card) 90%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
  }
  .sheets-head[hidden], .sheets-head [hidden] { display: none; }
  .sheets-head .eyebrow { margin-right: auto; }
  .sheets-head .eyebrow b { font-weight: 650; color: var(--ink); margin-left: 3px; font-variant-numeric: tabular-nums; }
  .sheets-head button { border: 1px solid var(--rule); background: var(--soft); border-radius: 7px; padding: 3px 8px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .sheets-head button:disabled { opacity: 0.45; cursor: default; }
  .dockstep { display: inline-flex; align-items: center; gap: 2px; }
  .dockstep span { min-width: 6.5em; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
  .sheets-body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  /* The kept list scrolls. A 1 px inset keeps a lit sheet's ring inside the scroll box. */
  .sheets-list { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; display: flex; flex-direction: column; gap: 8px; padding: 1px; margin: -1px; pointer-events: auto; }
  .sheets-list:empty { display: none; }
  .screen {
    position: relative; flex: none; pointer-events: auto; overflow: hidden;
    padding: 8px 12px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.45;
    background: color-mix(in srgb, var(--card) 90%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
  }
  /* The preview sits under the kept list and takes at most half the column; a longer sheet scrolls inside it. */
  .sheets-body > .screen { max-height: calc(50% - 8px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .screen.float { position: absolute; width: 280px; max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; box-shadow: 0 8px 26px rgb(0 0 0 / 0.14); }
  .screen.enter { animation: screen-in .32s ease-out backwards; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(8px); clip-path: inset(0 0 85% 0); } to { opacity: 1; transform: none; clip-path: inset(0); } }
  .screen.live { border-style: dashed; }
  .screen.hot { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .screen.dragging { opacity: 0.9; }
  /* A folded sheet keeps only its top bar; its chevron opens it again. */
  .screen.folded { padding-bottom: 6px; }
  .screen.folded > :not(.bar) { display: none; }
  .screen.folded .bar { margin-bottom: 0; }
  /* A bar names the sub-part in full, wrapping rather than cut off, so a folded sheet still says what it holds. Under
     it, a second line: the Preview label, on how many pieces the sheet is the same, or for the part card, the piece
     in view. */
  .screen .bar { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 6px; margin: 0 -6px 4px 0; font: 600 12px/18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--muted); user-select: none; }
  .screen .bar.grab { cursor: grab; touch-action: none; }
  .screen.dragging .bar { cursor: grabbing; }
  .screen .bar .ttl { flex: 1 1 0; min-width: 0; font-weight: 600; color: var(--ink); white-space: normal; overflow-wrap: anywhere; }
  .screen .bar .line2 { order: 1; flex: 1 0 100%; min-width: 0; font-weight: 400; line-height: 16px; color: var(--muted); white-space: normal; overflow-wrap: anywhere; }
  .screen .bar .fold-btn ~ .line2 { padding-left: 30px; }
  .screen .bar .state { margin-right: 8px; font-weight: 600; }

  /* In a view under 660 px the column becomes a bottom sheet, one card at a time. It peeks: 30 % of the view, enough

  .isobar { position: absolute; top: 36px; left: 0; right: 0; width: fit-content; margin-inline: auto; display: none; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 4px 4px 4px 12px; box-shadow: 0 4px 18px rgb(0 0 0 / 0.08); max-width: calc(100% - 200px); flex-wrap: wrap; justify-content: center; row-gap: 4px; z-index: 2; }

  /* The model's own labels, drawn only while the view is still: the seat ring and its tether, the leader line from a

// ---------- Theme and per-viewer preferences ----------
const store = {
