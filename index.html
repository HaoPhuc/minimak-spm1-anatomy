<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPM1 Anatomy</title>
<meta name="description" content="An interactive anatomy of the MinimaK SPM1 simple magnetised torus: turn it like a turntable, take it apart, inspect each component on its own and read where every number comes from.">
<style>
  :root {
    --paper: #f2f0e9;
    --card: #fbfaf6;
    --ink: #1c1c1a;
    --muted: #6a6962;
    --rule: #dad7cd;
    --soft: #efede5;
    --chip: #e8e5da;
    --accent: #cf5320;
    --spec: #2b8a6e;
    --photo: #b07a12;
    --assumed: #8a8882;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #111110;
      --card: #191917;
      --ink: #ebe9e1;
      --muted: #9c9a91;
      --rule: #34332e;
      --soft: #22211e;
      --chip: #2a2925;
      --accent: #ff985a;
      --spec: #5fd3a8;
      --photo: #e9b44c;
      --assumed: #9c9a91;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #111110;
    --card: #191917;
    --ink: #ebe9e1;
    --muted: #9c9a91;
    --rule: #34332e;
    --soft: #22211e;
    --chip: #2a2925;
    --accent: #ff985a;
    --spec: #5fd3a8;
    --photo: #e9b44c;
    --assumed: #9c9a91;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono, kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- App shell: tree | viewer | inspector, each scrolls on its own ---------- */
  .app {
    display: grid; height: 100vh; height: 100dvh; gap: 10px; padding: 10px;
    grid-template-columns: 260px minmax(0, 1fr) 360px;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top top top" "tree view insp";
  }
  .top { grid-area: top; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand { flex: none; line-height: 1.2; }
  .brand b { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .brand span { display: block; color: var(--muted); font-size: 12px; }
  .modebar { display: flex; gap: 8px; align-items: center; margin-left: auto; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .modebar::-webkit-scrollbar { display: none; }
  .mb { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; background: var(--card); overflow: hidden; flex: none; }
  .mb button { border: 0; background: transparent; padding: 6px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 1; white-space: nowrap; }
  .mb button + button { border-left: 1px solid var(--rule); }
  .mb button:hover { background: var(--soft); }
  .mb button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .mb svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  button:focus-visible, input:focus-visible, .stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .panel { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .panel-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--rule); }
  .panel-body { overflow-y: auto; overscroll-behavior: contain; padding: 8px 12px 14px; flex: 1; min-height: 0; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

  /* ---------- Assembly tree ---------- */
  .tree { grid-area: tree; }
  .search { width: 100%; margin-top: 8px; font: inherit; font-size: 13px; color: var(--ink); background: var(--soft); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 9px; }
  .tg { margin-top: 6px; }
  .tg-head { display: flex; align-items: center; gap: 2px; }
  .tg-head .caret { flex: 1; display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 2px; cursor: pointer; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .tg-head .caret::before { content: ""; width: 0; height: 0; border-left: 4px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; transform: rotate(90deg); }
  .tg.closed .tg-head .caret::before { transform: rotate(0); }
  .tg.closed ul { display: none; }
  .tg ul { list-style: none; margin: 0; padding: 0; }
  .ti { display: flex; align-items: center; gap: 2px; border-radius: 7px; }
  .ti:hover, .ti.hot { background: var(--soft); }
  .ti.sel { background: var(--chip); }
  .ti .name { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 7px; border: 0; background: none; padding: 5px 4px; cursor: pointer; text-align: left; font-size: 13px; }
  .ti .name span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti .n { font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); min-width: 1.6em; }
  .ti .cnt { font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
  .eye { flex: none; width: 26px; height: 24px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
  .eye:hover { color: var(--ink); background: var(--chip); }
  .eye svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  .eye[aria-pressed="false"] { opacity: 0.45; }
  .ti.off .name { opacity: 0.45; }
  .basis { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; border: 1.5px solid; }
  .basis.spec { background: var(--spec); border-color: var(--spec); }
  .basis.photo { background: linear-gradient(90deg, var(--photo) 50%, transparent 50%); border-color: var(--photo); }
  .basis.assumed { border-color: var(--assumed); }
  .legend-basis { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); padding: 10px 2px 2px; border-top: 1px solid var(--rule); margin-top: 12px; }
  .legend-basis div { display: flex; align-items: center; }
  .nd { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; padding: 0; list-style: none; }
  .nd li { padding: 3px 4px; display: flex; gap: 8px; justify-content: space-between; }
  .nd li span:last-child { font-size: 11.5px; white-space: nowrap; }

  /* ---------- Viewer card ---------- */
  .view { grid-area: view; position: relative; margin: 0; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; min-height: 0; }
  .stage { position: absolute; inset: 0; cursor: grab; touch-action: none; outline: none; }
  .stage.pan { cursor: move; }
  .stage.dragging { cursor: grabbing; }
  .stage.pointing { cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .corner { position: absolute; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); pointer-events: none; }
  .corner.tl { top: 12px; left: 14px; color: var(--ink); }
  .corner.tl span { color: var(--muted); }
  .corner.bl { bottom: 10px; left: 12px; max-width: 60%; }
  .corner.br { bottom: 10px; right: 12px; text-align: right; color: var(--ink); max-width: 38%; }
  .corner.bl .hint, .corner.br { background: color-mix(in srgb, var(--card) 84%, transparent); padding: 3px 6px; border-radius: 6px; }
  .scale { display: flex; align-items: flex-end; gap: 6px; margin: 0 0 6px 6px; color: var(--ink); }
  .scale i { display: block; height: 7px; border: 1.5px solid var(--ink); border-top: 0; }
  .triad { position: absolute; top: 8px; right: 8px; width: 84px; height: 84px; }
  .triad text { font: 600 10px ui-monospace, Menlo, Consolas, monospace; fill: var(--ink); cursor: pointer; }
  .triad .ax { cursor: pointer; }
  .triad .ax:hover circle { stroke-width: 2.4; }
  .triad .ring { fill: color-mix(in srgb, var(--card) 70%, transparent); stroke: var(--rule); }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--card); font-size: 12px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; transform: translate(12px, 14px); opacity: 0; transition: opacity .12s; }
  .tip.on { opacity: 0.94; }
  .tip small { opacity: 0.7; margin-left: 6px; }
  .isobar { position: absolute; top: 36px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 4px 4px 4px 12px; box-shadow: 0 4px 18px rgb(0 0 0 / 0.08); max-width: calc(100% - 200px); }
  .isobar.on { display: flex; }
  .isobar .lbl { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 6px; }
  .isobar .lbl b { font-weight: 600; }
  .isobar button { border: 1px solid var(--rule); background: var(--soft); border-radius: 7px; padding: 4px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .isobar button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .isobar button.done { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .slide { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 0 8px; white-space: nowrap; }
  .slide[hidden] { display: none; }
  .slide input { width: 92px; accent-color: var(--accent); }
  .slide output { font: 11.5px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); min-width: 3em; }
  .mb .slide { border-left: 1px solid var(--rule); }
  .mb button[aria-disabled="true"] { opacity: 0.4; }
  .subs { list-style: none; margin: 0; padding: 0; }
  .subs button { width: calc(100% + 12px); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border: 0; background: none; text-align: left; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; font-size: 13px; cursor: default; }
  .subs button:hover { background: var(--soft); }
  .subs .k { font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: nowrap; }
  .fallback { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

  /* ---------- Inspector ---------- */
  .insp { grid-area: insp; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--chip); color: var(--ink); }
  .doc h2 { font-size: 19px; line-height: 1.25; margin: 2px 0 8px; font-weight: 650; }
  .doc h2 .count { font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); font-weight: 400; }
  .doc h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  .doc p { margin: 0 0 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { font-size: 11.5px; background: var(--chip); border-radius: 999px; padding: 2px 9px; color: var(--muted); display: inline-flex; align-items: center; border: 0; }
  button.chip { cursor: pointer; color: var(--ink); }
  button.chip:hover { background: var(--rule); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
  .actions button { border: 1px solid var(--rule); background: var(--soft); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
  .actions button.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
  table.specs { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.specs td { padding: 5px 0; border-top: 1px solid var(--rule); vertical-align: top; }
  table.specs td:first-child { color: var(--muted); padding-right: 10px; width: 38%; }
  table.specs td:last-child { text-align: right; padding-left: 8px; overflow-wrap: anywhere; }
  table.specs .ref { white-space: nowrap; margin-left: 2px; }
  .ref { font: 11px ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--rule); background: var(--soft); border-radius: 5px; padding: 0 4px; cursor: pointer; color: var(--ink); }
  .ref:hover { border-color: var(--muted); }
  .ref.derived, .ref.photo { cursor: default; color: var(--muted); }
  .know { border-left: 3px solid var(--accent); padding-left: 10px; }
  .pieces { display: flex; flex-wrap: wrap; gap: 5px; }
  .pieces button { border: 1px solid var(--rule); background: var(--soft); border-radius: 7px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
  .pieces button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .srclist { list-style: none; margin: 0; padding: 0; }
  .srclist li { padding: 10px 0; border-top: 1px solid var(--rule); }
  .srclist li:first-child { border-top: 0; }
  .srclist .sid { font: 600 12px ui-monospace, Menlo, Consolas, monospace; margin-right: 6px; }
  .srclist .who { color: var(--muted); font-size: 12.5px; }
  .srclist p { margin: 6px 0; font-size: 13px; color: var(--muted); }
  .srclist li.flash { animation: flash 1.2s; }
  @keyframes flash { 0% { background: var(--chip); } 100% { background: transparent; } }
  table.keys { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.keys td { padding: 5px 0; border-top: 1px solid var(--rule); vertical-align: top; }
  table.keys td:first-child { white-space: nowrap; padding-right: 12px; color: var(--muted); }
  kbd { font-size: 11px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--soft); }
  .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 12px; }
  .stat div { background: var(--soft); border-radius: 8px; padding: 8px; }
  .stat b { display: block; font-size: 18px; font-weight: 650; }
  .stat span { font-size: 11.5px; color: var(--muted); }

  @media (max-width: 1180px) { .app { grid-template-columns: 230px minmax(0, 1fr) 320px; } }
  @media (max-width: 960px) {
    html, body { height: auto; }
    .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "top" "view" "insp" "tree"; }
    .top { flex-wrap: wrap; }
    .modebar { margin-left: 0; width: 100%; }
    .view { height: 64vh; min-height: 360px; }
    .panel { max-height: none; }
    .panel-body { overflow: visible; }
    .isobar { max-width: calc(100% - 100px); left: 10px; transform: none; flex-wrap: wrap; }
    .corner.br { max-width: 50%; }
    .mb .lbl { display: none; }
  }
  @media (max-width: 520px) {
    .triad { width: 68px; height: 68px; }
    .corner.bl { max-width: 52%; }
    .corner.bl .hint { display: none; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>MinimaK SPM1</b><span>anatomy of a tabletop magnetised torus</span></div>
    <nav class="modebar" aria-label="View tools">
      <div class="mb" role="group" aria-label="Left-drag does">
        <button type="button" data-drag="orbit" aria-pressed="true" title="Left-drag turns the model like a turntable (O)"><svg viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 1 1 11.6 3.8"/><path d="M13.6 1.8v3h-3"/></svg><span class="lbl">Orbit</span></button>
        <button type="button" data-drag="pan" aria-pressed="false" title="Left-drag slides the view (P)"><svg viewBox="0 0 16 16"><path d="M8 1.5v13M1.5 8h13M6 3.5l2-2 2 2M6 12.5l2 2 2-2M3.5 6l-2 2 2 2M12.5 6l2 2-2 2"/></svg><span class="lbl">Pan</span></button>
      </div>
      <div class="mb" role="group" aria-label="Zoom">
        <button type="button" id="bZoomIn" title="Zoom in (+)"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l4 4M5 7h4M7 5v4"/></svg></button>
        <button type="button" id="bZoomOut" title="Zoom out (−)"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l4 4M5 7h4"/></svg></button>
        <button type="button" id="bHome" title="Reset view (0, or double-click empty space)"><svg viewBox="0 0 16 16"><path d="M2 7.5L8 2l6 5.5M3.8 6v8h8.4V6"/></svg></button>
        <button type="button" id="bFitAll" title="Fit the whole system, stand and pump included (A)"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
      </div>
      <div class="mb" role="group" aria-label="Look from">
        <button type="button" data-view="iso" title="Three-quarter view (1)">Iso</button>
        <button type="button" data-view="front" title="From the front (2)">Front</button>
        <button type="button" data-view="right" title="From the right (3)">Right</button>
        <button type="button" data-view="top" title="From above (4)">Top</button>
      </div>
      <div class="mb" role="group" aria-label="Model">
        <button type="button" id="bExplode" aria-pressed="false" title="Take the machine apart (E)"><svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="5" height="5"/><path d="M8 1v2.5M8 12.5V15M1 8h2.5M12.5 8H15"/></svg><span class="lbl">Explode</span></button>
        <label class="slide" id="spreadWrap" hidden title="How far apart the components move ([ and ])">Spread <input type="range" id="sSpread" min="0.4" max="2.5" step="0.05" value="1" aria-label="Explode distance"><output id="oSpread">1.0×</output></label>
        <button type="button" id="bCut" aria-pressed="true" title="Cut away the top of the vessel to show the plasma (C)"><svg viewBox="0 0 16 16"><path d="M2 9a6 6 0 0 0 12 0z"/><path d="M5 6.5l1.5-3M10 6.5l-1.5-3" opacity=".55"/></svg><span class="lbl">Cutaway</span></button>
      </div>
      <div class="mb"><button type="button" id="themeBtn" title="Switch colour theme"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor"/></svg><span class="lbl" id="themeLbl">Theme</span></button></div>
    </nav>
  </header>

  <aside class="panel tree" aria-labelledby="treeTitle">
    <div class="panel-head">
      <div class="eyebrow" id="treeTitle">Assembly</div>
      <input class="search" id="search" type="search" placeholder="Find a part…" aria-label="Find a part" autocomplete="off">
    </div>
    <div class="panel-body" id="tree"></div>
  </aside>

  <figure class="view" id="card">
    <div class="stage" id="stage" tabindex="0" role="application" aria-label="3D model of the MinimaK SPM1. Drag to turn, right-drag to pan, scroll to zoom, double-click a part to inspect it on its own.">
      <canvas id="canvas"></canvas>
    </div>
    <div class="fallback" id="fallback">This figure needs WebGL. The parts list and the sources still work.</div>
    <div class="corner tl">Fig 1 <span>· SPM1, Rideo Systems</span></div>
    <svg class="triad" id="triad" viewBox="-42 -42 84 84" aria-label="Orientation. Click an axis to look along it." role="group"></svg>
    <div class="isobar" id="isobar">
      <span class="lbl" id="isoLabel"></span>
      <button type="button" id="bAll" title="Back to every piece of this part (Esc)">All</button>
      <button type="button" id="bApart" aria-pressed="false" title="Take the part apart into its pieces (T)">Take apart</button>
      <label class="slide" id="apartWrap" hidden title="How far the pieces move apart ([ and ])">Spread <input type="range" id="sApart" min="0.4" max="2.5" step="0.05" value="1" aria-label="Take-apart distance"><output id="oApart">1.0×</output></label>
      <button type="button" id="bContext" aria-pressed="true" title="Show the rest of the machine as a ghost (G)">Context</button>
      <button type="button" class="done" id="bDone" title="Back to the assembly (Esc)">Done</button>
    </div>
    <div class="tip" id="tip"></div>
    <div class="corner bl"><div class="scale" id="scale"><i></i><span></span></div><div class="hint" id="hint"></div></div>
    <div class="corner br" id="readout"></div>
  </figure>

  <aside class="panel insp" aria-label="Inspector">
    <div class="panel-head">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tPart" aria-selected="true" aria-controls="inspBody">Part</button>
        <button type="button" role="tab" id="tSources" aria-selected="false" aria-controls="inspBody">Sources</button>
        <button type="button" role="tab" id="tHelp" aria-selected="false" aria-controls="inspBody">Controls</button>
      </div>
    </div>
    <div class="panel-body doc" id="inspBody" role="tabpanel" aria-live="polite"></div>
  </aside>
</div>

<script src="parts.js"></script>
<script src="device.js"></script>
<script type="module">
import * as THREE from 'three';

THREE.ColorManagement.enabled = false;

const DOCS = window.SPM1_DOCS;
const partById = new Map(DOCS.PARTS.map((p) => [p.id, p]));
const srcById = new Map(DOCS.SOURCES.map((s) => [s.id, s]));
const DEG = Math.PI / 180;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const coarse = matchMedia('(pointer: coarse)').matches;
const $ = (id) => document.getElementById(id);
const stage = $('stage');
const canvas = $('canvas');
const V3 = THREE.Vector3;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const clamp01 = (x) => clamp(x, 0, 1);
const ease = (x) => x * x * (3 - 2 * x);

const HOLES = /* glsl */`
  #ifdef HOLES

`;

const VERT = /* glsl */`
  #include <clipping_planes_pars_vertex>

  void main() {

const FRAG_COLOR = /* glsl */`
  #include <clipping_planes_pars_fragment>
  ${HOLES}
  uniform vec3 uColor;
  uniform vec3 uLitColor;
  uniform float uLit;
  uniform vec3 uEmit;
  uniform vec3 uLight;
  uniform vec3 uCut;
  uniform vec3 uInk;
  uniform float uDpr;
  varying vec3 vNv;
  varying vec3 vNw;
  void main() {
    #include <clipping_planes_fragment>
    #ifdef HOLES
      holes();
    #endif

    float k = dot(n, uLight);
    float w = smoothstep(-0.4, 1.0, k);
    float top = smoothstep(0.6, 1.0, vNw.z);
    float tone = mix(0.66, 1.05, w) + 0.06 * top;
    vec3 c = uColor * tone;
    c = mix(c, uLitColor, uLit);
    gl_FragColor = vec4(c + uEmit, 1.0);
  }
`;

const FRAG_INK = /* glsl */`
  #include <clipping_planes_pars_fragment>
  ${HOLES}
  uniform float uId;
  varying vec3 vNv;
  varying vec3 vNw;
  void main() {
    #include <clipping_planes_fragment>
    #ifdef HOLES
      holes();
    #endif
    if (!gl_FrontFacing) { gl_FragColor = vec4(0.5, 0.5, 1.0, 1.0); return; }
    gl_FragColor = vec4(normalize(vNv) * 0.5 + 0.5, uId);
  }
`;

// The ghost is ink at a low alpha that thickens toward silhouettes, so the context reads as an x-ray outline.
const FRAG_GHOST = /* glsl */`
  #include <clipping_planes_pars_fragment>
  uniform vec3 uInk;
  uniform float uGhost;
  varying vec3 vNv;
  varying vec3 vNw;
  void main() {
    #include <clipping_planes_fragment>
    float rim = 1.0 - abs(normalize(vNv).z);
    gl_FragColor = vec4(uInk, uGhost * (0.22 + 0.78 * pow(rim, 1.6)));
  }
`;

// Window glass is see-through: a faint tint, stronger at grazing angles, with a small glint.
const FRAG_GLASS = /* glsl */`
  #include <clipping_planes_pars_fragment>
  uniform vec3 uColor;
  uniform vec3 uLitColor;
  uniform float uLit;
  uniform vec3 uLight;
  uniform float uGlass;
  uniform float uLoose;
  varying vec3 vNv;
  varying vec3 vNw;
  void main() {
    #include <clipping_planes_fragment>
    vec3 n = normalize(vNv);
    float rim = pow(1.0 - abs(n.z), 2.0);
    float glint = pow(max(dot(n, uLight), 0.0), 14.0);
    vec3 c = mix(uColor, uLitColor, uLit) + vec3(0.4 * glint);
    gl_FragColor = vec4(c, uGlass * (0.5 + 0.5 * rim) * (1.0 + 1.4 * uLoose) + 0.3 * uLit + 0.2 * glint);

`;

const sectorPlanes = [new THREE.Plane(new V3(0, 0, -1), 1e6), new THREE.Plane(), new THREE.Plane()];

const colorMats = new Map();
function colorMat(tone, clip) {
  const key = `${tone}|${clip ? 1 : 0}`;
  if (colorMats.has(key)) return colorMats.get(key);
  const glass = tone === 'glass';
  const m = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color() }, uLit: { value: 0 }, uEmit: { value: new THREE.Color(0, 0, 0) },
      uLight: shared.uLight, uCut: shared.uCut, uInk: shared.uInk, uLitColor: shared.uLitColor, uDpr: shared.uDpr, uGlass: shared.uGlass, uLoose: { value: 0 },

    vertexShader: VERT, fragmentShader: glass ? FRAG_GLASS : FRAG_COLOR, side: glass ? THREE.FrontSide : THREE.DoubleSide,
    transparent: glass, depthWrite: !glass, clipping: true,

  m.userData.clip = clip;

  return m;
}
function inkMat(clip, holes) {

  m.userData.clip = clip;

const INK = { clip: inkMat(true), free: inkMat(false), clipHoles: inkMat(true, true), freeHoles: inkMat(false, true) };
const GHOST = new THREE.ShaderMaterial({
  uniforms: { uInk: shared.uInk, uGhost: shared.uGhost },
  vertexShader: VERT, fragmentShader: FRAG_GHOST, transparent: true, depthWrite: false, side: THREE.FrontSide,
});
GHOST.userData.ghost = true;

const solids = [];
// Small detail that only clutters the ghost of the context: holes, bolts, slots, rules, LEDs.
const FINE = new Set(['hole', 'bolt', 'slot', 'ink', 'tapeline', 'led', 'tip']);
let nextInk = 0;
const ZERO = new THREE.Color(0, 0, 0);

function perMesh(r, s, c, g, material) {
  if (material.userData.ghost) return;
  const u = material.uniforms;
  if (material.userData.ink) u.uId.value = this.userData.inkId;
  else {
    u.uLit.value = this.userData.lit;
    u.uEmit.value.copy(this.userData.emit);
    // A window taken out of its flange is drawn more solid, so it reads as a part of its own.
    if (material.userData.tone === 'glass') u.uLoose.value = Math.min(1, this.position.length() / 3);
  }
  material.uniformsNeedUpdate = true;
}
function register(mesh, tone, o) {
  mesh.userData.part = o.part;
  mesh.userData.tone = tone;
  mesh.userData.lit = 0;
  mesh.userData.emit = ZERO.clone();
  mesh.userData.clip = !!o.clip;
  mesh.userData.colorMat = mesh.material;
  mesh.userData.inkMat = tone === 'vessel' ? (o.clip ? INK.clipHoles : INK.freeHoles) : o.clip ? INK.clip : INK.free;
  mesh.userData.inkId = ((nextInk++ % 250) + 2) / 255;
  mesh.onBeforeRender = perMesh;
  if (tone === 'glass') mesh.renderOrder = 10;
  solids.push(mesh);
}
function paint(geometry, tone, o) {
  const mesh = new THREE.Mesh(geometry, colorMat(tone, o.clip));
  register(mesh, tone, o);
  return mesh;
}
paint.instanced = (geometry, tone, matrices, o) => {
  const mesh = new THREE.InstancedMesh(geometry, colorMat(tone, o.clip), matrices.length);
  matrices.forEach((m, i) => mesh.setMatrixAt(i, m));
  mesh.instanceMatrix.needsUpdate = true;
  mesh.computeBoundingSphere();
  register(mesh, tone, o);
  return mesh;
};

// ---------- Build the machine ----------
const dev = window.SPM1Device.build(THREE, paint);
scene.add(dev.root);
const DIMS = dev.dims;

  shared.uHoleP.value[i].set(h.p.x, h.p.y, h.p.z, h.len);
});
const R0 = DIMS.R0;
{
  const a0 = DIMS.cut[0] * DEG, a1 = DIMS.cut[1] * DEG;
  sectorPlanes[1].set(new V3(Math.sin(a0), -Math.cos(a0), 0), 0);
  sectorPlanes[2].set(new V3(-Math.sin(a1), Math.cos(a1), 0), 0);

const firstInkOf = new Map();
for (const m of solids) if (!firstInkOf.has(m.userData.part)) firstInkOf.set(m.userData.part, m.userData.inkId);
for (const m of solids) if (m.userData.sameInkAs) m.userData.inkId = firstInkOf.get(m.userData.sameInkAs);
const groupByName = new Map(dev.groups.map((g) => [g.obj.name, g]));
for (const g of dev.groups) g.p = 0;

// Each piece: its meshes, its box at rest, the explode group that carries it and how it detaches.
function meshBox(m, out) {
  const g = m.geometry;
  if (!g.boundingBox) g.computeBoundingBox();
  if (m.isInstancedMesh) {
    const im = new THREE.Matrix4(), b = new THREE.Box3();
    for (let i = 0; i < m.count; i++) { m.getMatrixAt(i, im); b.copy(g.boundingBox).applyMatrix4(im).applyMatrix4(m.matrixWorld); out.union(b); }
  } else out.union(g.boundingBox.clone().applyMatrix4(m.matrixWorld));
  return out;
}
dev.root.updateMatrixWorld(true);
const pieces = dev.instances;
const piecesOf = new Map();
for (const pc of pieces) {
  const part = pc.userData.part;
  if (!piecesOf.has(part)) piecesOf.set(part, []);
  piecesOf.get(part).push(pc);
  const box = new THREE.Box3();
  pc.traverse((o) => { if (o.isMesh) { o.userData.piece = pc; o.userData.restBox = meshBox(o, new THREE.Box3()); box.union(o.userData.restBox); } });
  pc.userData.restBox = box;
  let g = pc.parent, eg = null;
  while (g && !eg) { eg = dev.groups.find((x) => x.obj === g) || null; g = g.parent; }
  pc.userData.egroup = eg;
  const spec = dev.detach[part] || {};
  let v;
  if (pc.userData.detach) v = pc.userData.detach.clone();
  else {
    v = new V3(0, 0, spec.lift || 0);
    const c = box.getCenter(new V3());
    const r = new V3(c.x, c.y, 0);
    if (spec.spread && r.lengthSq() > 1) v.add(r.normalize().multiplyScalar(spec.spread));
  }

  pc.userData.dp = 0;
  pc.userData.tp = 0;
  pc.userData.ghost = false;
}
// The named sub-parts of a part (or of one piece), in build order, with how many pieces carry each.
function subsOf(part, only) {
  const out = new Map();
  for (const pc of only ? [only] : piecesOf.get(part) || []) {
    const seen = new Set();
    pc.traverse((m) => { if (m.isMesh && m.userData.sub && !seen.has(m.userData.sub)) { seen.add(m.userData.sub); out.set(m.userData.sub, (out.get(m.userData.sub) || 0) + 1); } });
  }

}
for (const [part, list] of piecesOf) list.forEach((pc, i) => { if (!pc.userData.label) pc.userData.label = list.length > 1 ? `${partById.get(part)?.name || part} ${i + 1}` : partById.get(part)?.name || part; });

// ---------- Plasma glow (layer 1, no ink) and a soft floor shadow ----------
const GLOW_VERT = /* glsl */`
  uniform float uR0;
  uniform float uMinor;
  varying vec3 vNv;
  varying float vPhi;
  void main() {
    float phi = atan(position.y, position.x);
    vec3 c = vec3(uR0 * cos(phi), uR0 * sin(phi), 0.0);
    vec3 p = c + (position - c) * uMinor;
    vNv = normalize(normalMatrix * normal);
    vPhi = phi;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }
`;
const GLOW_FRAG = /* glsl */`
  uniform vec3 uCore;
  uniform vec3 uRim;
  uniform float uI;
  uniform float uTime;
  varying vec3 vNv;
  varying float vPhi;
  void main() {
    float f = abs(normalize(vNv).z);
    float core = pow(f, 1.6);
    float s = 1.0 - 0.12 * (0.5 - 0.5 * cos(vPhi * 22.0 - uTime * 0.8));
    float a = clamp(uI * (0.16 + 0.84 * core) * s, 0.0, 0.95);
    gl_FragColor = vec4(mix(uRim, uCore, core * core), a);
  }
`;
const torusUnit = new THREE.TorusGeometry(R0, 1, 40, 320);
const glow = [[1, 5.0], [1.38, 5.0]].map(([sc, minor], i) => {
  const mat = new THREE.ShaderMaterial({

    vertexShader: GLOW_VERT, fragmentShader: GLOW_FRAG, transparent: true, depthWrite: false,

  const mesh = new THREE.Mesh(torusUnit, mat);

const shadow = (() => {

// ---------- Post-processing: colour, then normals + ids + depth, then ink ----------
const post = (() => {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      tColor: { value: null }, tNid: { value: null }, tDepth: { value: null },
      uTexel: { value: new THREE.Vector2() }, uThick: { value: 1 }, uInk: shared.uInk,
      uRange: { value: camera.far - camera.near }, uDepthT: { value: 0.45 }, uInkAlpha: { value: 0.9 },
    },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: /* glsl */`
      uniform sampler2D tColor;
      uniform sampler2D tNid;
      uniform sampler2D tDepth;
      uniform vec2 uTexel;
      uniform float uThick;
      uniform vec3 uInk;
      uniform float uRange;
      uniform float uDepthT;
      uniform float uInkAlpha;
      varying vec2 vUv;
      float dep(vec2 uv) { return texture2D(tDepth, uv).x * uRange; }
      vec3 nrm(vec4 t) { return t.a > 0.0 ? normalize(t.xyz * 2.0 - 1.0) : vec3(0.0); }
      void probe(vec2 uv, vec4 c, vec3 nc, inout float lap, inout float ne, inout float ide) {
        vec4 t = texture2D(tNid, uv);
        lap += dep(uv);
        if (c.a > 0.0 && t.a > 0.0) ne = max(ne, 1.0 - dot(nc, nrm(t)));
        ide = max(ide, step(0.0015, abs(t.a - c.a)));
      }
      void main() {
        vec2 ox = vec2(uTexel.x * uThick, 0.0);
        vec2 oy = vec2(0.0, uTexel.y * uThick);
        vec4 c = texture2D(tNid, vUv);
        vec3 nc = nrm(c);
        float lap = 0.0, ne = 0.0, ide = 0.0;
        probe(vUv + ox, c, nc, lap, ne, ide);
        probe(vUv - ox, c, nc, lap, ne, ide);
        probe(vUv + oy, c, nc, lap, ne, ide);
        probe(vUv - oy, c, nc, lap, ne, ide);
        lap = abs(lap - 4.0 * dep(vUv));
        float eD = smoothstep(uDepthT, uDepthT * 3.0, lap);
        float eN = smoothstep(0.2, 0.55, ne) * 0.72;
        float e = clamp(max(max(eD, eN), ide * 0.95), 0.0, 1.0);
        vec3 col = texture2D(tColor, vUv).rgb;
        gl_FragColor = vec4(mix(col, uInk, e * uInkAlpha), 1.0);
      }
    `,
    depthTest: false, depthWrite: false,
  });

  geom.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
  geom.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 2, 0, 0, 2], 2));

  mesh.frustumCulled = false;

  s.add(mesh);

})();

let rtColor = null, rtInk = null, dpr = 1, width = 1, height = 1;
let dirty = true;
function resize() {
  if (!renderer) return;
  const r = stage.getBoundingClientRect();
  width = Math.max(1, Math.round(r.width));
  height = Math.max(1, Math.round(r.height));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(width, height, false);
  const w = Math.round(width * dpr), h = Math.round(height * dpr);
  rtColor?.dispose();
  rtInk?.dispose();
  rtColor = new THREE.WebGLRenderTarget(w, h, { samples: 4 });
  rtInk = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthTexture: new THREE.DepthTexture(w, h) });
  post.mat.uniforms.tColor.value = rtColor.texture;
  post.mat.uniforms.tNid.value = rtInk.texture;
  post.mat.uniforms.tDepth.value = rtInk.depthTexture;
  post.mat.uniforms.uTexel.value.set(1 / w, 1 / h);
  post.mat.uniforms.uThick.value = Math.max(1, dpr * 0.75);
  shared.uDpr.value = dpr;
  fitView();
  dirty = true;
}

function draw() {
  const pal = THEME[themeName()];
  for (const m of solids) {
    const ghost = m.userData.piece?.userData.ghost;
    m.material = ghost ? GHOST : m.userData.colorMat;
    m.visible = !(ghost && FINE.has(m.userData.tone));
  }

  camera.layers.enable(1);
  renderer.setRenderTarget(rtColor);

// ---------- Turntable camera: azimuth about the vertical, elevation, orthographic zoom, pan ----------

const VIEWS = {

  // A slow turntable spin until the first touch, never after it.
  if (!touched && !reduceMotion.matches && now - idleSince > 2.5) { goal.az += 5 * dt; active = true; }

  const k = reduceMotion.matches ? 1 : 1 - Math.exp(-dt * 16);
  const d = Math.abs(goal.az - view.az) + Math.abs(goal.el - view.el) + Math.abs(Math.log(goal.zoom / view.zoom)) * 50 + goal.target.distanceTo(view.target);
  if (d > 1e-3) {
    view.az += (goal.az - view.az) * k;
    view.el += (goal.el - view.el) * k;
    view.zoom = Math.exp(Math.log(view.zoom) + (Math.log(goal.zoom) - Math.log(view.zoom)) * k);
    view.target.lerp(goal.target, k);
    active = true;
  } else { view.az = goal.az; view.el = goal.el; view.zoom = goal.zoom; view.target.copy(goal.target); }

  const follow = (x, t, rate) => { if (reduceMotion.matches) return t; const y = x + (t - x) * (1 - Math.exp(-dt * rate)); return Math.abs(t - y) < 1e-4 ? t : y; };
  let moving = false;
  const sp0 = state.spreadNow, ap0 = iso.apartNow;
  state.spreadNow = follow(state.spreadNow, state.spread, 6);
  iso.apartNow = follow(iso.apartNow, iso.apartSpread, 6);
  const spreadMoved = state.spreadNow !== sp0, apartMoved = iso.apartNow !== ap0;

  // The explode: groups move with a stagger, each piece adds its own offset, the spread scales both.
  const target = state.explode ? 1 : 0;
  for (const g of dev.groups) {
    const delay = state.explode ? g.delay : 0.45 - g.delay;
    const before = g.p;
    if (!(now - state.explodeAt < delay && !reduceMotion.matches)) g.p = follow(g.p, target, 4.2);
    else if (Math.abs(target - g.p) > 1e-4) moving = true;
    if (g.p !== before || spreadMoved) { moving = true; g.obj.position.copy(g.offset).multiplyScalar(ease(g.p) * state.spreadNow); }
  }
  const ep0 = state.ep;
  state.ep = follow(state.ep, target, 4.2);
  if (state.ep !== ep0) moving = true;

  // Inspect lifts a part out; take-apart moves each of its sub-parts along its own direction.
  for (const pc of pieces) {
    const u = pc.userData;
    const d0 = u.dp, t0 = u.tp;
    u.dp = follow(u.dp, iso.part === u.part ? 1 : 0, 5);
    u.tp = follow(u.tp, iso.part === u.part && iso.apart && (!iso.focus || iso.focus === pc) ? 1 : 0, 4.5);
    const p = u.egroup ? u.egroup.p : state.ep;
    if (u.dp !== d0 || moving) {
      pc.position.copy(u.detachVec).multiplyScalar(ease(u.dp)).addScaledVector(u.apart, ease(p) * state.spreadNow);
      moving = true;
    }
    if (u.tp !== t0 || (apartMoved && u.tp > 0)) {
      const k = ease(u.tp) * iso.apartNow;
      pc.traverse((m) => { if (m.isMesh) m.position.copy(m.userData.ex).multiplyScalar(k); });
      moving = true;
    }
  }
  if (moving) { rebuildStretch(); applyLook(); active = true; }

  const cutTarget = state.cut && !iso.part && !state.explode ? 0 : 45;
  if (Math.abs(state.cutZ - cutTarget) > 0.01) {
    state.cutZ = reduceMotion.matches ? cutTarget : state.cutZ + (cutTarget - state.cutZ) * (1 - Math.exp(-dt * 6));
    if (Math.abs(state.cutZ - cutTarget) < 0.05) state.cutZ = cutTarget;
    active = true;
  }
  sectorPlanes[0].constant = state.cutZ >= 44.9 ? 1e6 : state.cutZ;

  if (hoverPending && !drag) {
    setHover(pickMesh(hoverPending));
    hoverPending = null;
  }

  if (!active && !dirty) return;
  dirty = false;
  placeCamera();
  draw();
  drawTriad();
  drawScale();
  updateReadout();
}

// ---------- Start ----------
setHint();
setDragMode(dragMode);
buildTree();
renderInspector();
refreshPieces();
applyClip();
if (renderer) {
  new ResizeObserver(resize).observe(stage);
  new IntersectionObserver((entries) => { visible = entries[0].isIntersecting; dirty = true; }).observe(stage);
  document.addEventListener('visibilitychange', () => { lastT = performance.now() / 1000; dirty = true; });
  resize();
}
applyTheme();
requestAnimationFrame(frame);
window.__spm1 = { view, goal, iso, state, inspect, endInspect, select, lookFrom, setExplode, setCut, setApart, focusPiece, piecesOf, fitAll, resetView };
</script>
