<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPM1 Anatomy</title>
<meta name="description" content="An interactive anatomy of the MinimaK SPM1 simple magnetised torus: turn it like a turntable, take it apart, inspect each component on its own and read where every number comes from.">
<style>
  :root {
    --paper: #f2f0e9;
    --card: #fbfaf6;
    --ink: #1c1c1a;
    --muted: #5e5d57;
    --rule: #dad7cd;
    --soft: #efede5;
    --chip: #e8e5da;
    --accent: #0a736e;
    --spec: #2b8a6e;
    --photo: #9a6a0f;
    --assumed: #7c7a74;
    color-scheme: light;
  }
  /* The dark theme is a hologram. The class is set before first paint (script below) and by applyTheme. */
  :root.holo {
    --paper: #03080f;
    --card: #06121e;
    --ink: #cfe3f2;
    --muted: #7a9fb9;
    --rule: #16314a;
    --soft: #0a1b2a;
    --chip: #0e2436;
    --accent: #6fb8e8;
    --spec: #3cf0b4;
    --photo: #ffb54d;
    --assumed: #6a8ea8;
    --glow: rgb(90 170 225 / 0.35);
    color-scheme: dark;
    scrollbar-color: #1b3a55 transparent;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono, kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  /* Read by screen readers, never seen: the one status line. Pinned to the top-left corner of its containing block, so
     wherever it sits (even last in the body) it adds no scrollable overflow. */
  .sr-only { position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: 0; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

  /* ---------- App shell: tree | viewer | inspector, each scrolls on its own ---------- */
  .app {
    --tw: 260px; --iw: 360px;
    display: grid; height: 100vh; height: 100dvh; row-gap: 10px; padding: 10px;
    grid-template-columns: var(--tw) 10px minmax(0, 1fr) 10px var(--iw);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top top top top top" "tree gl view gr insp";
  }
  .top { grid-area: top; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand { flex: none; line-height: 1.2; }
  .brand b { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .brand span { display: block; color: var(--muted); font-size: 12px; }
  /* The tools wrap to a second row rather than scroll out of sight. */
  .modebar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; align-items: center; margin-left: auto; padding: 2px; }
  .mb { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; background: var(--card); overflow: hidden; flex: none; }
  .mb button { border: 0; background: transparent; padding: 6px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 1; white-space: nowrap; }
  .mb button + button { border-left: 1px solid var(--rule); }
  .mb button:hover { background: var(--soft); }
  .mb button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .mb svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  button:focus-visible, input:focus-visible, .stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .panel { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  /* Either side panel folds to a thin rail, to give the model and its screens the room. */
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .fold { flex: none; width: 26px; height: 24px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 17px; line-height: 1; }
  .fold:hover { background: var(--chip); color: var(--ink); }
  .rail { display: none; }
  /* The grip between a panel and the view sizes the panel; a line shows while it is hovered or dragged. */
  .grip { position: relative; cursor: col-resize; touch-action: none; outline: none; }
  .grip.left { grid-area: gl; }
  .grip.right { grid-area: gr; }
  .grip::after { content: ""; position: absolute; top: 8px; bottom: 8px; left: 4px; width: 2px; border-radius: 1px; background: var(--accent); opacity: 0; transition: opacity .15s; }
  .grip:hover::after, .grip.on::after, .grip:focus-visible::after { opacity: 0.7; }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing .stage { pointer-events: none; }
  .app.fold-tree { --tw: 34px; }
  .app.fold-insp { --iw: 34px; }
  .panel.folded > :not(.rail) { display: none; }
  .panel.folded .rail { display: block; flex: 1; border: 0; background: none; cursor: pointer; writing-mode: vertical-rl; font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 12px 0; }
  .panel.folded .rail:hover { color: var(--ink); background: var(--soft); }
  .panel-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--rule); }
  .panel-body { overflow-y: auto; overscroll-behavior: contain; padding: 8px 12px 14px; flex: 1; min-height: 0; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

  /* ---------- Assembly tree ---------- */
  .tree { grid-area: tree; }
  .search { width: 100%; margin-top: 8px; font: inherit; font-size: 13px; color: var(--ink); background: var(--soft); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 9px; }
  .tg { margin-top: 6px; }
  .tg-head { display: flex; align-items: center; gap: 2px; }
  .tg-head .caret { flex: 1; display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 2px; cursor: pointer; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .tg-head .caret::before { content: ""; width: 0; height: 0; border-left: 4px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; transform: rotate(90deg); }
  .tg.closed .tg-head .caret::before { transform: rotate(0); }
  .tg.closed ul { display: none; }
  .tg ul { list-style: none; margin: 0; padding: 0; }
  .ti { display: flex; align-items: center; gap: 2px; border-radius: 7px; }
  .ti:hover, .ti.hot { background: var(--soft); }
  .ti.sel { background: var(--chip); }
  .ti .name { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 7px; border: 0; background: none; padding: 5px 4px; cursor: pointer; text-align: left; font-size: 13px; }
  .ti .name span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti .n { font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); min-width: 1.6em; }
  .ti .cnt { font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
  .ti-hit button { width: 100%; border: 0; background: none; text-align: left; padding: 3px 4px 3px 52px; border-radius: 7px; font-size: 12px; cursor: pointer; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti-hit button:hover { background: var(--soft); }
  .ti-hit.more { padding: 2px 4px 4px 52px; font-size: 11.5px; color: var(--muted); }
  .eye { flex: none; width: 26px; height: 24px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
  .eye:hover { color: var(--ink); background: var(--chip); }
  .eye svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  .eye[aria-pressed="false"] { opacity: 0.45; }
  .ti.off .name { opacity: 0.45; }
  .basis { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; border: 1.5px solid; }
  .basis.spec { background: var(--spec); border-color: var(--spec); }
  .basis.photo { background: linear-gradient(90deg, var(--photo) 50%, transparent 50%); border-color: var(--photo); }
  .basis.assumed { border-color: var(--assumed); }
  .legend-basis { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); padding: 10px 2px 2px; border-top: 1px solid var(--rule); margin-top: 12px; }
  .legend-basis div { display: flex; align-items: center; }
  .nd { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; padding: 0; list-style: none; }
  .nd li { padding: 3px 4px; display: flex; gap: 8px; justify-content: space-between; }
  .nd li span:last-child { font-size: 11.5px; white-space: nowrap; }

  /* ---------- Viewer card ---------- */
  .view { grid-area: view; position: relative; margin: 0; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; min-height: 0; }
  .stage { position: absolute; inset: 0; cursor: grab; touch-action: none; outline: none; }
  .stage.pan { cursor: move; }
  .stage.dragging { cursor: grabbing; }
  .stage.pointing { cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .corner { position: absolute; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); pointer-events: none; }
  .corner.tl { top: 12px; left: 14px; color: var(--ink); }
  .corner.tl span { color: var(--muted); }
  .corner.bl { bottom: 10px; left: 12px; max-width: 60%; }
  .corner.br { bottom: 10px; right: 12px; text-align: right; color: var(--ink); max-width: 38%; }
  .corner.bl .hint, .corner.br { background: color-mix(in srgb, var(--card) 84%, transparent); padding: 3px 6px; border-radius: 6px; }
  .scale { display: flex; align-items: flex-end; gap: 6px; margin: 0 0 6px 6px; color: var(--ink); }
  .scale i { display: block; height: 7px; border: 1.5px solid var(--ink); border-top: 0; }
  .triad { position: absolute; top: 8px; right: 8px; width: 84px; height: 84px; }
  .triad text { font: 600 10px ui-monospace, Menlo, Consolas, monospace; fill: var(--ink); cursor: pointer; }
  .triad .ax { cursor: pointer; }
  .triad .ax:hover circle { stroke-width: 2.4; }
  .triad .ring { fill: color-mix(in srgb, var(--card) 70%, transparent); stroke: var(--rule); }
  .tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--card); font-size: 12px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; transform: translate(12px, 14px); opacity: 0; transition: opacity .12s; }
  .tip.on { opacity: 0.94; }
  .tip small { opacity: 0.7; margin-left: 6px; }
  /* Information screens float beside the inspected part. The left column describes the component; the right one holds
     sub-part sheets: a live one for the sub-part under the pointer, and the ones you pinned, which stay until closed. */
  .hud { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .hud[hidden] { display: none; }
  .screen {
    position: absolute; width: 280px; max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; pointer-events: auto;
    padding: 8px 12px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.45;
    background: color-mix(in srgb, var(--card) 90%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
    box-shadow: 0 8px 26px rgb(0 0 0 / 0.14);
  }
  .screen.enter { animation: screen-in .32s ease-out backwards; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(8px); clip-path: inset(0 0 85% 0); } to { opacity: 1; transform: none; clip-path: inset(0); } }
  .screen.live { border-style: dashed; }
  .screen.hot { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 8px 26px rgb(0 0 0 / 0.14); }
  .screen.comp { max-height: 52%; }
  .screen.links { max-height: 36%; }
  .screen.dragging { opacity: 0.9; }
  /* Another piece's sheet is marked by a rule down its left edge, not dimmed, so its text keeps its contrast. */
  .screen.other, .holo .screen.other { border-left: 3px solid var(--muted); }
  /* A folded sheet keeps only its top bar; a click on the bar opens it again. */
  .screen.folded { padding-bottom: 6px; overflow: hidden; }
  .screen.folded > :not(.bar) { display: none; }
  .screen.folded .bar { margin-bottom: 0; cursor: pointer; }
  .screen .keep { margin: 0 0 6px; font-size: 12px; color: var(--accent); }
  .screen .bar { cursor: grab; touch-action: none; user-select: none; }
  .screen.dragging .bar { cursor: grabbing; }
  /* A sheet's bar names the sub-part in full, wrapping rather than cut off, so a folded sheet still says what it holds.
     The piece goes on its own line under it; the Preview label and the button stay on the first line, at the right.
     A component bar keeps its code, title and state; its state drops to a second line when it does not fit. */
  .screen .bar { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 6px; margin: 0 -6px 4px 0; font: 600 12px/18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--muted); }
  .screen .bar .code { flex: none; font: 600 12px/18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .screen .bar .ttl { flex: 1 1 0; min-width: 0; font-weight: 600; color: var(--ink); white-space: normal; overflow-wrap: anywhere; }
  .screen.comp .bar .ttl { flex-basis: auto; }
  .screen .bar .piece { order: 1; flex: 1 0 100%; min-width: 0; font-weight: 400; line-height: 16px; color: var(--muted); white-space: normal; overflow-wrap: anywhere; }
  .screen .bar .state { flex: none; margin-left: auto; display: inline-flex; align-items: center; }
  .screen .bar button { flex: none; width: 24px; height: 22px; margin: -2px 0; border: 0; background: none; border-radius: 5px; cursor: pointer; color: var(--muted); display: grid; place-items: center; font-size: 16px; line-height: 1; }
  .screen .bar button:hover { background: var(--chip); color: var(--ink); }
  .screen .bar button svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
  .screen .bar button[aria-pressed="true"] { color: var(--accent); }
  .screen .bar button[aria-pressed="true"] svg { fill: currentColor; }
  .screen h4 { margin: 0 0 2px; font-size: 15px; font-weight: 650; line-height: 1.25; }
  .screen h4 .count { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); font-weight: 400; }
  .screen h5 { margin: 10px 0 4px; font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .screen .from { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .screen p { margin: 6px 0 0; }
  .screen .mat { margin: 0 0 6px; }
  .screen .mat b { font-weight: 600; }
  .screen .note { color: var(--muted); }
  .screen table.specs { font-size: 12.5px; }
  .screen table.specs td { padding: 4px 0; }
  .screen table.specs td:first-child { width: 42%; }
  .screen .srcs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .screen .subs button { font-size: 12.5px; padding: 3px 6px; }
  .screen .chips { margin: 0; }
  /* On a phone there is one screen, docked under the model. */
  .hud.phone .screen { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 42%; }
  .hud.phone .screen .bar { cursor: default; }
  .view.sheet .corner.bl, .view.sheet .corner.br { display: none; }
  @media (prefers-reduced-motion: reduce) { .screen.enter { animation: none; } }
  .isobar { position: absolute; top: 36px; left: 0; right: 0; width: fit-content; margin-inline: auto; display: none; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 4px 4px 4px 12px; box-shadow: 0 4px 18px rgb(0 0 0 / 0.08); max-width: calc(100% - 200px); flex-wrap: wrap; justify-content: center; row-gap: 4px; z-index: 2; }
  .isobar.on { display: flex; }
  .isobar > :not(.lbl) { flex: none; }
  .isobar .lbl { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 6px; }
  .isobar .lbl b { font-weight: 600; }
  .isobar button { border: 1px solid var(--rule); background: var(--soft); border-radius: 7px; padding: 4px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .isobar button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .isobar button.done { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .isobar #bBack { max-width: 13em; overflow: hidden; text-overflow: ellipsis; }
  .isobar .step { display: inline-flex; }
  .isobar .step[hidden] { display: none; }
  .isobar .step button { border-radius: 0; margin-left: -1px; }
  .isobar .step button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
  .isobar .step button:last-child { border-radius: 0 7px 7px 0; }
  .isobar .step #bAll { min-width: 4.6em; font-variant-numeric: tabular-nums; }
  .isobar .sheets { position: relative; display: inline-flex; }
  .isobar .sheets[hidden] { display: none; }
  .isobar .sheets b { font: 600 11px ui-monospace, Menlo, Consolas, monospace; margin-left: 2px; }
  .isobar .sheets .menu { position: absolute; top: calc(100% + 6px); right: 0; display: flex; flex-direction: column; gap: 3px; padding: 4px; background: var(--card); border: 1px solid var(--rule); border-radius: 9px; box-shadow: 0 6px 20px rgb(0 0 0 / 0.14); z-index: 3; }
  .isobar .sheets .menu[hidden] { display: none; }
  .isobar .sheets .menu button { text-align: left; }
  .isobar button.flash { animation: flash-btn 0.5s ease-in-out 3; }
  @keyframes flash-btn { 50% { background: var(--accent); color: var(--card); border-color: var(--accent); } }
  @media (prefers-reduced-motion: reduce) { .isobar button.flash { animation: none; outline: 2px solid var(--accent); } }
  .slide { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 0 8px; white-space: nowrap; }
  .slide[hidden] { display: none; }
  .slide input { width: 92px; accent-color: var(--accent); }
  .slide output { font: 11.5px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); min-width: 3em; }
  .mb .slide { border-left: 1px solid var(--rule); }
  .mb button[aria-disabled="true"] { opacity: 0.4; }
  .subs { list-style: none; margin: 0; padding: 0; }
  .subs button { width: calc(100% + 12px); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border: 0; background: none; text-align: left; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; font-size: 13px; cursor: default; }
  .subs button:hover { background: var(--soft); }
  .subs button { cursor: pointer; }
  .subs button.on { background: var(--chip); }
  .subs button.on span:first-child { font-weight: 600; }
  .subs .k { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: nowrap; }
  .fallback { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

  /* ---------- Inspector ---------- */
  .insp { grid-area: insp; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--chip); color: var(--ink); }
  .doc h2 { font-size: 19px; line-height: 1.25; margin: 2px 0 8px; font-weight: 650; }
  .doc h2 .count { font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); font-weight: 400; }
  .doc h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  .doc p { margin: 0 0 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { font-size: 12px; background: var(--chip); border-radius: 999px; padding: 2px 9px; color: var(--muted); display: inline-flex; align-items: center; border: 0; }
  button.chip { cursor: pointer; color: var(--ink); }
  button.chip:hover { background: var(--rule); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
  .actions button { border: 1px solid var(--rule); background: var(--soft); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
  .actions button.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
  table.specs { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.specs td { padding: 5px 0; border-top: 1px solid var(--rule); vertical-align: top; }
  table.specs td:first-child { color: var(--muted); padding-right: 10px; width: 38%; }
  table.specs td:last-child { text-align: right; padding-left: 8px; overflow-wrap: anywhere; }
  table.specs .ref { white-space: nowrap; margin-left: 2px; }
  .ref { font: 11.5px ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--rule); background: var(--soft); border-radius: 5px; padding: 0 4px; cursor: pointer; color: var(--ink); }
  .ref:hover { border-color: var(--muted); }
  .ref.derived, .ref.photo, .ref.assumed, .ref.none { cursor: default; color: var(--muted); }
  .ref.assumed, .ref.std { border-style: dashed; }
  .tagkey { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .tagkey b { font: 600 12px ui-monospace, Menlo, Consolas, monospace; }
  .know { border-left: 3px solid var(--accent); padding-left: 10px; }
  .pieces { display: flex; flex-wrap: wrap; gap: 5px; }
  .pieces button { border: 1px solid var(--rule); background: var(--soft); border-radius: 7px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
  .pieces button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }

// The ink pass goes first: the hologram's colour pass reads its depth to tell the nearest surface from the ones behind.
function draw() {
  const pal = THEME[themeName()];
  camera.layers.set(0);
  for (const m of solids) {
    const u = m.userData.piece?.userData;
    const g = u ? ease(u.gNow) : 0;
    m.material = m.userData.inkMat;
    // A part fading to a ghost loses its outline halfway; one turning solid gets its outline first, then its fill.
    m.visible = !((u && (u.ghost ? g > 0.5 : g >= 1)) || (m.userData.tone === 'glass' && m.position.lengthSq() < 1e-4));
  }
  renderer.setRenderTarget(rtInk);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.render(scene, camera);

  for (const m of solids) {
    const g = m.userData.piece ? ease(m.userData.piece.userData.gNow) : 0;
    m.userData.dim = 1;
    m.visible = true;
    const lit = m.userData.lit > 0;
    if (g <= 0) m.material = m.userData.colorMat;
    else if (holo) { m.material = m.userData.colorMat; m.userData.dim = lit ? Math.max(0.6, 1 - (1 - pal.ghost) * g) : 1 - (1 - pal.ghost) * g; m.visible = lit || !(g >= 1 && FINE.has(m.userData.tone)); }
    // A ghosted sub-part that is lit (its sheet kept or under the pointer) fills in partly, so it can still be found.
    else if (g >= 1 && lit) { m.material = GHOST_FADE; m.userData.solid = 0.55; }
    else if (g >= 1) { m.material = GHOST; m.visible = !FINE.has(m.userData.tone); }
    else { m.material = GHOST_FADE; m.userData.solid = 1 - g; }
  }
  camera.layers.enable(1);
  renderer.setRenderTarget(rtColor);
  renderer.setClearColor(pal.paper, 1);
  renderer.clear();
  renderer.render(scene, camera);
  for (const m of solids) { m.material = m.userData.colorMat; m.visible = true; }

  renderer.setRenderTarget(null);
  renderer.render(post.scene, post.camera);
}

// ---------- Turntable camera: azimuth about the vertical, elevation, orthographic zoom, pan ----------
// Horizontal drag spins the model about z, vertical drag tilts it, z stays up (plotly's turntable mode).
const HOME = { az: -56, el: 24 };
const ZOOM_MIN = 0.3, ZOOM_MAX = 40;
const view = { az: HOME.az, el: HOME.el, zoom: 1, target: new V3() };
const goal = { az: HOME.az, el: HOME.el, zoom: 1, target: new V3() };

let glide = null;

function basis(az, elv) {

}

  // `centre` lies in the view plane through the origin; push it back to the points' mean depth so turning pivots on them.
  const { dir } = basis(az, elv);

}

const VIEWS = {
  iso: [HOME.az, HOME.el],
  front: [-90, 6],
  right: [0, 6],
  back: [90, 6],
  left: [180, 6],

// ---------- State ----------
const state = { explode: false, explodeAt: -1e9, ep: 0, spread: 1, spreadNow: 1, cut: true, cutZ: 0, select: null, hover: null, hoverPiece: null, hoverMesh: null, hoverSub: null, rowPiece: null, legendHot: null, leaveUntil: 0, pins: [], live: null, hotSheet: null, pNow: 1, plasmaHold: 0 };

// ---------- Clipping: the sector cutaway, only in the assembled machine ----------

// ---------- Inspect: the part detaches, the rest becomes a ghost, the camera frames it ----------

// Drag a screen by its top bar; a click anywhere on one brings it to the front. A sheet dragged out of the column stays
// where it is dropped, and a preview dropped anywhere is kept; if it lands on the part, the part moves into the largest
// free space. A click on a folded bar opens that sheet, a double-click on an open bar folds it.
hud.addEventListener('pointerdown', (e) => {
  const sc = e.target.closest('.screen');
  if (!sc) return;
  sc.style.zIndex = String(++HUD.z);
  const bar = e.target.closest('.bar');
  if (!bar || e.target.closest('button') || phoneHud() || e.button !== 0) return;
  e.preventDefault();
  bar.setPointerCapture(e.pointerId);
  sc.classList.add('dragging');
  const start = { x: sc.offsetLeft, y: sc.offsetTop, cx: e.clientX, cy: e.clientY };
  let moved = false;
  const move = (ev) => {
    if (!moved && Math.abs(ev.clientX - start.cx) + Math.abs(ev.clientY - start.cy) < 4) return;
    if (!moved) { moved = true; if (!HUD.folded.has(sc.dataset.key)) sc.classList.remove('folded'); sc.style.maxHeight = ''; }
    const x = clamp(start.x + ev.clientX - start.cx, 4, width - sc.offsetWidth - 4);
    const y = clamp(start.y + ev.clientY - start.cy, 4, height - 36);
    sc.style.left = `${x}px`;
    sc.style.top = `${y}px`;
    HUD.pos.set(sc.dataset.key, { x, y });

    bar.removeEventListener('pointermove', move);
    bar.removeEventListener('pointerup', up);
    bar.removeEventListener('pointercancel', up);
    sc.classList.remove('dragging');
    const key = sc.dataset.key;
    if (!moved) {
      HUD.justOpened = null;
      if (sc.classList.contains('folded')) {
        HUD.folded.delete(key);
        HUD.unfold = key;
        HUD.justOpened = key;
        renderHud();

      return;
    }
    let dropped = sc;
    if (key === 'live' && state.live) {
      const x = state.live;
      pinSheet(x.pc, x.sub);
      dropped = HUD.els.get(sheetKey(x)) || sc;

  bar.addEventListener('pointerup', up);

});

// A screen dropped on the part moves the part into the largest free rectangle of the view, keeping the zoom unless

function relRect(node, s) { const r = node.getBoundingClientRect(); return { x0: r.left - s.left, y0: r.top - s.top, x1: r.right - s.left, y1: r.bottom - s.top }; }

function screenBoxOf(box) {
  const { right, up } = basis(goal.az, goal.el);
  const k = (2 * fit.half) / goal.zoom / height;
  const r = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const d = new V3(x, y, z).sub(goal.target);
    const px = width / 2 + d.dot(right) / k, py = height / 2 - d.dot(up) / k;
    r.x0 = Math.min(r.x0, px); r.x1 = Math.max(r.x1, px); r.y0 = Math.min(r.y0, py); r.y1 = Math.max(r.y1, py);
  }

}
// The largest rectangle of the view that no screen and no inspect bar covers, with an 8 px margin round each.
function largestFreeRect() {
  const s = stage.getBoundingClientRect();
  const m = 8;
  const blocks = [...HUD.els.values(), $('isobar')].map((n) => relRect(n, s)).map((r) => ({ x0: r.x0 - m, y0: r.y0 - m, x1: r.x1 + m, y1: r.y1 + m }));
  // The sheet column is kept for sheets even where it is empty.
  if (sheetColumn()) blocks.push({ x0: width - hudInsets().r, y0: 0, x1: width, y1: height });
  const xs = [...new Set([0, width, ...blocks.flatMap((b) => [b.x0, b.x1])].map((v) => clamp(v, 0, width)))].sort((a, b) => a - b);
  const ys = [...new Set([0, height, ...blocks.flatMap((b) => [b.y0, b.y1])].map((v) => clamp(v, 0, height)))].sort((a, b) => a - b);
  let best = null;
  for (let i = 0; i < xs.length; i++) for (let j = i + 1; j < xs.length; j++) {
    const w = xs[j] - xs[i];
    if (best && w * height <= best.w * best.h) continue;
    for (let a = 0; a < ys.length; a++) for (let b = ys.length - 1; b > a; b--) {
      const h = ys[b] - ys[a];
      if (best && w * h <= best.w * best.h) break;
      const r = { x0: xs[i], y0: ys[a], x1: xs[j], y1: ys[b] };
      if (!blocks.some((k) => overlaps(k, r))) { best = { x: r.x0, y: r.y0, w, h }; break; }
    }

}
function nudgeIntoGap(sc) {

  const b = iso.focus ? boxOfPiece(iso.focus) : boxOfPart(iso.part);
  if (b.isEmpty()) return;
  const part = screenBoxOf(b);
  if (!overlaps(part, relRect(sc, stage.getBoundingClientRect()))) return;
  const g = largestFreeRect();
  if (!g || g.w < 160 || g.h < 160) {
    const t = $('bSheets');
    t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
    clearTimeout(HUD.flashTimer);
    HUD.flashTimer = setTimeout(() => t.classList.remove('flash'), 1600);
    return;
  }

  const f = Math.min(1, (0.9 * g.w) / Math.max(1, part.x1 - part.x0), (0.9 * g.h) / Math.max(1, part.y1 - part.y0));
  goal.zoom = clamp(goal.zoom * f, ZOOM_MIN, ZOOM_MAX);

  const { right, up } = basis(goal.az, goal.el);
  goal.target.copy(b.getCenter(new V3()))
    .addScaledVector(right, -(g.x + g.w / 2 - width / 2) * k)
    .addScaledVector(up, (g.y + g.h / 2 - height / 2) * k);
  dirty = true;
}

  state.hover = id;
  state.hoverPiece = pc;
  state.hoverMesh = mesh;
  stage.classList.toggle('pointing', !!pc);
  refreshLit();
  // While inspecting, the preview names the sub-part, so the tooltip only shows without screens. A pinned sheet
  // lights up while its sub-part is under the pointer.
  const screens = iso.part && HUD.on && !phoneHud();
  if (screens && !coarse) setLive(sub ? { pc, sub, at: lastPointer ? pointAt(lastPointer) : null } : null);
  const hotKey = pc && sub ? sheetKey({ pc, sub }) : '';
  for (const [k, sc] of HUD.els) if (k.startsWith('pin|')) sc.classList.toggle('hot', k === hotKey);
  if (pc && lastPointer && !coarse && !screens) {
    const r = stage.getBoundingClientRect();
    const p = partById.get(id);
    if (iso.part) tip.replaceChildren(sub || pc.userData.label, el('small', null, sub ? 'click for its sheet' : 'double-click to zoom'));
    else tip.replaceChildren(p.name, el('small', null, 'double-click to inspect'));
    tip.style.left = `${lastPointer.clientX - r.left}px`;
    tip.style.top = `${lastPointer.clientY - r.top}px`;
    tip.classList.add('on');
  } else tip.classList.remove('on');
}

window.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const onStage = document.activeElement === stage;
  let used = true;
  if (k === 'e') setExplode(!state.explode);
  else if (k === 'c') setCut(!state.cut);
  else if (k === '0' || k === 'home') resetView();
  else if (k === 'a') fitAll();
  else if (k === '1') lookFrom(...VIEWS.iso);
  else if (k === '2') lookFrom(...VIEWS.front);
  else if (k === '3') lookFrom(...VIEWS.right);
  else if (k === '4') lookFrom(...VIEWS.top);
  else if (k === 'o') setDragMode('orbit');
  else if (k === 'p') setDragMode('pan');
  else if (k === 'i' && state.select) inspect(state.select);
  else if (k === 't' && iso.part) setApart(!iso.apart);
  else if (k === '[' || k === ']') {
    const dv = k === ']' ? 0.2 : -0.2;
    if (iso.part && iso.apart) { iso.apartSpread = clamp(iso.apartSpread + dv, 0.4, 2.5); $('sApart').value = iso.apartSpread; $('oApart').textContent = fmtSpread(iso.apartSpread); }
    else { state.spread = clamp(state.spread + dv, 0.4, 2.5); $('sSpread').value = state.spread; $('oSpread').textContent = fmtSpread(state.spread); if (!state.explode) setExplode(true); }
  }
  else if (k === 'g' && iso.part) { iso.context = !iso.context; refreshPieces(); updateIsoBar(); }
  else if (k === 'h' && state.select) { setHidden([state.select], !hidden.has(state.select)); renderInspector(); }
  else if (k === 's' && iso.part) setScreens(!HUD.on);
  else if (k === 'l' && iso.part) tidySheets();
  else if (k === 'backspace' && iso.history.length) goBack();
  else if (k === 'f') togglePanels();
  else if ((k === ',' || k === '.') && iso.part) stepPiece(k === '.' ? 1 : -1);
  else if (k === 'escape') {
    if (!$('sheetsMenu').hidden) closeSheetsMenu();
    else if (state.live) setLive(null, true);
    else if (state.pins.length) unpinSheet(state.pins[state.pins.length - 1]);
    else if (iso.focus) setFocus(null);
    else if (iso.part) endInspect();
    else select(null);
  }
  else if (onStage && k.startsWith('arrow')) {
    const sx = k === 'arrowleft' ? -1 : k === 'arrowright' ? 1 : 0, sy = k === 'arrowup' ? -1 : k === 'arrowdown' ? 1 : 0;
    if (e.shiftKey) panBy(-sx * 40, -sy * 40); else orbitBy(sx * 16, -sy * 16);
  }
  else if (onStage && (k === '+' || k === '=')) zoomBy(1.2);
  else if (onStage && (k === '-' || k === '_')) zoomBy(1 / 1.2);
  else used = false;
  if (used) { touched = true; dirty = true; if (onStage) e.preventDefault(); }
});

// ---------- Animation ----------
let visible = true, lastT = performance.now() / 1000, idleSince = lastT, lastDraw = 0;
// How far an object has moved from rest: the sum of its own and its parents' offsets.
function offsetOf(o) { const v = new V3(); for (let x = o; x && x !== dev.root; x = x.parent) v.add(x.position); return v; }
// A cable or hose follows the two things it plugs into, wherever explode, inspect or take-apart sends them.
function rebuildStretch() {
  for (const s of dev.stretch) {
    const a = offsetOf(s.ends[0]), b = offsetOf(s.ends[1]), h = offsetOf(s.mesh);
    const key = [a, b, h].map((v) => v.toArray().map((x) => x.toFixed(2)).join(',')).join('|');
    if (key === s.key) continue;
    const first = s.key == null;
    s.key = key;
    if (first && a.lengthSq() + b.lengthSq() + h.lengthSq() === 0) continue;
    const n = s.points.length;
    const pts = s.points.map((p, i) => p.clone().add(a.clone().lerp(b, i / (n - 1))).sub(h));
    s.mesh.geometry.dispose();
    s.mesh.geometry = dev.tube(pts, s.r, s.o);
  }
}

function frame() {
  requestAnimationFrame(frame);
  if (!renderer || !visible) return;
  const now = performance.now() / 1000;
  const dt = Math.min(0.05, now - lastT);
  lastT = now;
  let active = false;

  // A slow turntable spin until the first touch, never after it.
  if (!touched && !reduceMotion.matches && now - idleSince > 2.5) { goal.az += 5 * dt; active = true; }

  const k = reduceMotion.matches ? 1 : 1 - Math.exp(-dt * 16);
  const d = Math.abs(goal.az - view.az) + Math.abs(goal.el - view.el) + Math.abs(Math.log(goal.zoom / view.zoom)) * 50 + goal.target.distanceTo(view.target);
  if (glide) {
    // Hold still until the glide starts, then ease all the way there over its duration.
    if (now >= glide.at) {
      const f = glide.from || (glide.from = { az: view.az, el: view.el, zoom: view.zoom, target: view.target.clone() });
      const s = ease(clamp01((now - glide.at) / glide.dur));
      view.az = f.az + (goal.az - f.az) * s;
      view.el = f.el + (goal.el - f.el) * s;
      view.zoom = Math.exp(Math.log(f.zoom) + (Math.log(goal.zoom) - Math.log(f.zoom)) * s);
      view.target.lerpVectors(f.target, goal.target, s);
      if (s >= 1) glide = null;
    }
    active = true;
  } else if (d > 1e-3) {
    view.az += (goal.az - view.az) * k;
    view.el += (goal.el - view.el) * k;
    view.zoom = Math.exp(Math.log(view.zoom) + (Math.log(goal.zoom) - Math.log(view.zoom)) * k);
    view.target.lerp(goal.target, k);
    active = true;
  } else { view.az = goal.az; view.el = goal.el; view.zoom = goal.zoom; view.target.copy(goal.target); }

  const follow = (x, t, rate) => { if (reduceMotion.matches) return t; const y = x + (t - x) * (1 - Math.exp(-dt * rate)); return Math.abs(t - y) < 1e-4 ? t : y; };
  let moving = false;
  const sp0 = state.spreadNow, ap0 = iso.apartNow;
  state.spreadNow = follow(state.spreadNow, state.spread, 6);
  iso.apartNow = follow(iso.apartNow, iso.apartSpread, 6);
  const spreadMoved = state.spreadNow !== sp0, apartMoved = iso.apartNow !== ap0;

  // The explode: groups move with a stagger, each piece adds its own offset, the spread scales both.
  const target = state.explode ? 1 : 0;
  for (const g of dev.groups) {
    const delay = state.explode ? g.delay : 0.45 - g.delay;
    const before = g.p;
    if (!(now - state.explodeAt < delay && !reduceMotion.matches)) g.p = follow(g.p, target, 4.2);
    else if (Math.abs(target - g.p) > 1e-4) moving = true;
    if (g.p !== before || spreadMoved) { moving = true; g.obj.position.copy(g.offset).multiplyScalar(ease(g.p) * state.spreadNow); }
  }
  const ep0 = state.ep;
  state.ep = follow(state.ep, target, 4.2);
  if (state.ep !== ep0) moving = true;

  // Inspect lifts a part out; take-apart moves each of its sub-parts along its own direction. Going back, a part waits
  // for its sub-parts before it flies home, and the ghosts wait for it before they turn solid.
  for (const pc of pieces) {
    const u = pc.userData;
    const d0 = u.dp, t0 = u.tp, g0 = u.gNow;
    const out = iso.part === u.part ? 1 : 0;
    if (now >= u.dHold) u.dp = follow(u.dp, out, 3.2);
    else active = true;
    u.tp = follow(u.tp, iso.part === u.part && iso.apart && (!iso.focus || iso.focus === pc) ? 1 : 0, 4.5);
    // Half a second to fade to a ghost, a little longer back to solid (after its hold), eased where it is drawn.
    const gT = u.ghost ? 1 : 0;
    if (u.gNow !== gT) {
      if (reduceMotion.matches) u.gNow = gT;
      else if (gT) u.gNow = Math.min(1, u.gNow + dt / 0.5);
      else if (now >= u.gHold) u.gNow = Math.max(0, u.gNow - dt / 0.8);
      active = true;
    }
    if (u.gNow !== g0) moving = true;
    const p = u.egroup ? u.egroup.p : state.ep;
    if (u.dp !== d0 || moving) {
      pc.position.copy(u.detachVec).multiplyScalar(ease(u.dp)).addScaledVector(u.apart, ease(p) * state.spreadNow);
      moving = true;
    }
    if (u.tp !== t0 || (apartMoved && u.tp > 0)) {
      const k = ease(u.tp) * iso.apartNow;
      pc.traverse((m) => { if (m.isMesh) m.position.copy(m.userData.ex).multiplyScalar(k); });
      moving = true;
    }
  }
  // The plasma fades out with the ghosts and lights again with them.
  const pT = plasmaShown() ? 1 : 0;
  if (state.pNow !== pT) {
    if (reduceMotion.matches) state.pNow = pT;
    else if (!pT) state.pNow = Math.max(0, state.pNow - dt / 0.5);
    else if (now >= state.plasmaHold) state.pNow = Math.min(1, state.pNow + dt / 0.8);
    moving = true;
  }
  if (moving) { rebuildStretch(); applyLook(); active = true; }

  const leaving = now < state.leaveUntil;
  if (leaving) active = true;
  const cutTarget = state.cut && !iso.part && !state.explode && !leaving ? 0 : 45;
  if (Math.abs(state.cutZ - cutTarget) > 0.01) {
    state.cutZ = reduceMotion.matches ? cutTarget : state.cutZ + (cutTarget - state.cutZ) * (1 - Math.exp(-dt * 6));
    if (Math.abs(state.cutZ - cutTarget) < 0.05) state.cutZ = cutTarget;
    active = true;
  }
  sectorPlanes[0].constant = state.cutZ >= 44.9 ? 1e6 : state.cutZ;

  if (hoverPending && !drag) {
    setHover(pickMesh(hoverPending));
    hoverPending = null;
  }

  // The hologram's scan lines and sweep keep moving, at 30 frames a second when nothing else does.
  if (holo && !reduceMotion.matches && now - lastDraw > 1 / 30) active = true;

  if (!active && !dirty) return;
  dirty = false;
  lastDraw = now;
  placeCamera();
  const still = reduceMotion.matches;
  shared.uTime.value = still ? 0 : now % 1000;
  shared.uSweep.value = still ? -1e3 : DIMS.table.floor - 8 + (40 - DIMS.table.floor) * ((now % 7) / 7);
  shared.uScan.value = height / (5 * 2 * halfNow());
  draw();
  drawTriad();
  drawScale();
  updateReadout();
}

// ---------- Start ----------
setHint();
setDragMode(dragMode);
applyPanels();
buildTree();
renderInspector();
refreshPieces();
applyClip();
if (renderer) {
  let resizeQueued = false;
  new ResizeObserver(() => { if (!resizeQueued) { resizeQueued = true; requestAnimationFrame(() => { resizeQueued = false; resize(); }); } }).observe(stage);
  new IntersectionObserver((entries) => { visible = entries[0].isIntersecting; dirty = true; }).observe(stage);
  document.addEventListener('visibilitychange', () => { lastT = performance.now() / 1000; dirty = true; });
  resize();
}
applyTheme();
requestAnimationFrame(frame);
window.__spm1 = { view, goal, iso, state, inspect, endInspect, select, lookFrom, setExplode, setCut, setApart, focusPiece, piecesOf, fitAll, resetView, showSubOf, setLive, pinSheet, unpinSheet, setFocus, stepPiece, setScreens, setPanel, togglePanels };
</script>
</body>
</html>
